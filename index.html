function readSavedCoords(){
try{
return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
}catch(e){
return {};
}
}

function effectiveCoords(school,id,original){
const saved=readSavedCoords();
const value=saved[school]?.[id];
if(Array.isArray(value)&&
value.length===2&&
Number.isFinite(value[0])&&
Number.isFinite(value[1])){
return value;
}
return original;
}

function esc(s){
return String(s).replace(/[&<>"']/g,c=>({

}

</div>

<p class="edit-help">
편집 모드에서는 핀을 마우스나 손가락으로 끌어 원하는 건물 또는 도로변에 놓을 수 있습니다.
위치 저장은 현재 브라우저에만 적용됩니다.
</p>
<p id="edit-status" aria-live="polite"></p>
<textarea id="coordinate-output" readonly aria-label="핀 좌표 출력"></textarea>

<div class="map-legend">
${Object.entries(COLORS).map(([name,color])=>`
<span class="legend-item">
<span class="legend-dot" style="background:${color}"></span>
${name}
</span>
`).join('')}
</div>

<section class="section">
${sectionTitle(sid==='h'?'주변 장소 목록':'CITY DIRECTORY')}

<div class="place-search">
<input id="placequery"
oninput="renderPlaces()"
placeholder="장소 이름 검색"
aria-label="장소 이름 검색">

<select id="placecat"
onchange="renderPlaces()"
aria-label="장소 종류 선택">
<option value="전체">전체 장소</option>
${Object.keys(COLORS).map(c=>`
<option value="${c}">${c}</option>
`).join('')}
</select>
</div>

<div id="places" class="places"></div>
</section>`;
}

function clearMap(){
mapToken++;
editMode=false;
draftCoords={};

if(activePopup){
activePopup.remove();
activePopup=null;
}
if(realMap){
realMap.remove();
realMap=null;
}
markers=[];
activePlace=null;
}

function hideRealLabels(map){
const style=map.getStyle();
if(!style||!style.layers)return;

style.layers.forEach(layer=>{
if(layer.type==='symbol'){
try{
map.setLayoutProperty(layer.id,'visibility','none');
}catch(e){}
}
});
}

function initMap(){
if(!sid||page!=='map')return;

const token=mapToken;
const container=document.getElementById('real-map');

if(!container)return;

renderPlaces();

if(typeof maplibregl==='undefined'){
container.innerHTML=
'<p style="padding:25px;color:#26323b">지도 라이브러리를 불러오지 못했습니다.</p>';
return;
}

realMap=new maplibregl.Map({
container:'real-map',
style:'https://tiles.openfreemap.org/styles/liberty',
center:CENTERS[sid],
zoom:14.5,
minZoom:11,
maxZoom:19,
pitch:0,
bearing:0,
attributionControl:true,
dragRotate:false,
touchPitch:false,
renderWorldCopies:false
});

realMap.addControl(
new maplibregl.NavigationControl({
showCompass:false,
showZoom:true
}),
'bottom-right'
);

realMap.on('load',()=>{
if(token!==mapToken||!realMap)return;
hideRealLabels(realMap);
addAllMarkers();
fitAllMarkers();
});

realMap.on('styledata',()=>{
if(token!==mapToken||!realMap)return;
hideRealLabels(realMap);
});
}

function markerElement(place){
const element=document.createElement('button');

element.type='button';
element.className='fiction-pin';
element.style.setProperty(
'--pin',
COLORS[place[2]]||'#607080'
);

element.title=place[1];
element.setAttribute('aria-label',place[1]+' 위치 보기');

const name=document.createElement('span');
name.className='pin-name';
name.textContent=place[1];

const stem=document.createElement('span');
stem.className='pin-stem';

const dot=document.createElement('span');
dot.className='pin-dot';

element.append(name,stem,dot);

element.addEventListener('click',event=>{
event.stopPropagation();
if(!editMode)focusPlace(place[0]);
});

return element;
}

function addAllMarkers(){
if(!realMap||!sid)return;

markers.forEach(item=>item.marker.remove());
markers=[];

PLACES[sid].forEach(place=>{
const original=[
Number(place[3]),
Number(place[4])
];

const coordinates=effectiveCoords(
sid,place[0],original
);

if(!Number.isFinite(coordinates[0])||
!Number.isFinite(coordinates[1]))return;

const element=markerElement(place);

const marker=new maplibregl.Marker({
element:element,
anchor:'bottom',
offset:[0,0],
draggable:false
})
.setLngLat(coordinates)
.addTo(realMap);

const item={
id:place[0],
place,
coords:[...coordinates],
marker,
element
};

marker.on('dragend',()=>{
const pos=marker.getLngLat();

item.coords=[
Number(pos.lng.toFixed(7)),
Number(pos.lat.toFixed(7))
];

draftCoords[item.id]=[...item.coords];

setEditStatus(
place[1]+' 위치 변경됨 · 위치 저장을 눌러주세요.'
);
});

markers.push(item);
});
}

function fitAllMarkers(){
if(!realMap||markers.length===0)return;

const bounds=new maplibregl.LngLatBounds();

markers.forEach(item=>{
bounds.extend(item.coords);
});

realMap.fitBounds(bounds,{
padding:{top:85,bottom:85,left:85,right:85},
maxZoom:15,
duration:0
});
}

function focusPlace(id){
if(!sid)return;

const place=PLACES[sid].find(p=>p[0]===id);
const item=markers.find(m=>m.id===id);

if(!place)return;

activePlace=id;

markers.forEach(m=>{
m.element.classList.toggle('selected',m.id===id);
});

renderPlaces();

if(!realMap||!item)return;

if(activePopup){
activePopup.remove();
activePopup=null;
}

realMap.flyTo({
center:item.coords,
zoom:Math.max(realMap.getZoom(),16),
speed:1.2,
essential:true
});

const popupContent=document.createElement('div');

const heading=document.createElement('strong');
heading.textContent=place[1];

const desc=document.createElement('p');
desc.textContent=place[5];

popupContent.append(heading,desc);

activePopup=new maplibregl.Popup({
offset:30,
closeButton:true,
closeOnClick:true
})
.setLngLat(item.coords)
.setDOMContent(popupContent)
.addTo(realMap);
}

function renderPlaces(){
const root=document.getElementById('places');

if(!root||!sid)return;

const query=(
document.getElementById('placequery')?.value||''
).toLowerCase().trim();

const category=
document.getElementById('placecat')?.value||'전체';

const filtered=PLACES[sid].filter(place=>{
const categoryMatch=
category==='전체'||place[2]===category;

const nameMatch=
place[1].toLowerCase().includes(query);

return categoryMatch&&nameMatch;
});

root.innerHTML=filtered.map(place=>`
<button
class="place ${activePlace===place[0]?'selected':''}"
onclick="focusPlace('${place[0]}')">

<small>${place[2]}</small>
<strong>${esc(place[1])}</strong>
<p>${esc(place[5])}</p>

</button>
`).join('')||'<p>검색 결과가 없습니다.</p>';
}

/* =====================================
   직접 핀 위치 편집
===================================== */

function setEditStatus(message){
const el=document.getElementById('edit-status');
if(el)el.textContent=message;
}

function toggleEdit(){
if(!realMap)return;

editMode=!editMode;

const frame=document.querySelector('.real-map-frame');
if(frame)frame.classList.toggle('editing',editMode);

markers.forEach(item=>{
item.marker.setDraggable(editMode);
});

const btn=document.getElementById('edit-toggle');
if(btn){
btn.textContent=editMode?'편집 종료':'핀 위치 편집';
btn.classList.toggle('primary',!editMode);
}

if(activePopup){
activePopup.remove();
activePopup=null;
}

setEditStatus(editMode?
'편집 중: 원하는 핀을 드래그한 뒤 위치 저장을 눌러주세요.':
'편집 모드가 종료되었습니다.');
}

function savePositions(){
if(!sid||!realMap)return;

const saved=readSavedCoords();
saved[sid]=saved[sid]||{};

markers.forEach(item=>{
const pos=item.marker.getLngLat();

const coords=[
Number(pos.lng.toFixed(7)),
Number(pos.lat.toFixed(7))
];

item.coords=coords;
saved[sid][item.id]=coords;
});

try{
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(saved)
);
draftCoords={};

setEditStatus(
'현재 브라우저에 핀 위치를 저장했습니다. 다른 기기에도 적용하려면 좌표 복사 기능을 이용하세요.'
);
}catch(e){
setEditStatus(
'브라우저 저장에 실패했습니다. 좌표 복사로 위치를 보관해주세요.'
);
}
}

async function copyCoordinates(){
if(!sid||!realMap)return;

const rows=markers.map(item=>{
const pos=item.marker.getLngLat();
return {
id:item.id,
name:item.place[1],
longitude:Number(pos.lng.toFixed(7)),
latitude:Number(pos.lat.toFixed(7))
};
});

const result=JSON.stringify({
school:sid,
places:rows
},null,2);

const output=document.getElementById('coordinate-output');
if(output){
output.style.display='block';
output.value=result;
output.select();
}

try{
await navigator.clipboard.writeText(result);
setEditStatus(
'좌표를 복사했습니다. 이 내용을 채팅에 보내주면 홈페이지 기본 좌표로 반영할 수 있습니다.'
);
}catch(e){
setEditStatus(
'아래 좌표가 표시되었습니다. 전체 선택해서 복사해주세요.'
);
}
}

function resetPositions(){
if(!sid||!realMap)return;

if(!confirm(
'현재 학교의 브라우저 저장 좌표를 초기화할까요?'
))return;

const saved=readSavedCoords();
delete saved[sid];

try{
localStorage.setItem(
STORAGE_KEY,
JSON.stringify(saved)
);
}catch(e){}

draftCoords={};

markers.forEach(item=>{
const original=[
Number(item.place[3]),
Number(item.place[4])
];

item.coords=[...original];
item.marker.setLngLat(original);
});

setEditStatus(
'저장된 위치를 초기화하고 코드의 기본 좌표로 되돌렸습니다.'
);
}

portal();
</script>
</body>
</html>
