function hideRealLabels(m){
const style=m.getStyle();
if(!style||!style.layers)return;

if(layer.type==='symbol'){
try{m.setLayoutProperty(layer.id,'visibility','none')}catch(e){}

function initMap(){
renderPlaces();
const status=document.getElementById('map-status');
if(typeof maplibregl==='undefined'){
status.textContent='지도 라이브러리를 불러오지 못했습니다.';
return;
}
const session=mapSession;
map=new maplibregl.Map({
container:'real-map',
style:'https://tiles.openfreemap.org/styles/liberty',
center:CENTERS[sid],
zoom:14.5,
minZoom:11,
maxZoom:19,
attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
map.on('style.load',()=>{
if(session!==mapSession)return;
hideRealLabels(map);
status.textContent='실제 장소 위치를 확인하고 있습니다…';
loadPlaces(session);
});
map.on('error',()=>{
if(session===mapSession&&!markers.length){
status.textContent='지도 연결에 문제가 발생했습니다. 인터넷 연결을 확인해주세요.';
}
});
}
function wait(ms){
return new Promise(resolve=>setTimeout(resolve,ms));
}
async function geocode(query){
if(geoCache[query])return geoCache[query];
try{
const u='https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q='+encodeURIComponent(query);
const response=await fetch(u);
if(!response.ok)return null;
const result=await response.json();
if(result.length){
const coords=[Number(result[0].lon),Number(result[0].lat)];
geoCache[query]=coords;
return coords;
}
}catch(e){}
return null;
}
/*
코가 사용자 첨부 지도 기준:
파랑 학교 (514,354)
빨강 기숙사 (681,158)
노랑 아이스 아레나 (727,253)

학교 검색 좌표를 기준으로 이미지상의 상대 위치를
근사 변환한다. 정확한 건물 좌표 확정은 별도 검증 필요.
*/
function screenshotPoint(base,x,y){
return [
base[0]+(x-514)*0.0000159,
base[1]-(y-354)*0.0000108
];
}
function addMarker(p,coords){
if(!map||!coords)return;
const element=document.createElement('button');
element.type='button';
element.className='fiction-pin';
element.style.setProperty('--pin',COLORS[p[2]]||'#607080');
element.title=p[1];
const dot=document.createElement('span');
dot.className='pin-dot';
const name=document.createElement('span');
name.className='pin-name';
name.textContent=p[1];
element.append(dot,name);
element.addEventListener('click',()=>focusPlace(p[0]));
const marker=new maplibregl.Marker({
element,
anchor:'bottom'
}).setLngLat(coords).addTo(map);
markers.push({id:p[0],coords,marker});
}
async function loadPlaces(session){
const key=sid;
const places=PLACES[key];
const status=document.getElementById('map-status');
let school=null;
for(let i=0;i<places.length;i++){
if(session!==mapSession||!map)return;
const p=places[i];
let coords=null;
if(key==='k'&&(p[0]==='dorm'||p[0]==='rink')){
if(school){
coords=screenshotPoint(
school,
p[0]==='dorm'?681:727,
p[0]==='dorm'?158:253
);
}
}else if(p[3]){
coords=await geocode(p[3]);
if(p[0]==='school')school=coords;
if(i<places.length-1)await wait(1100);
}
if(session!==mapSession||!map)return;
if(coords)addMarker(p,coords);
status.textContent='장소 확인 중 · '+(i+1)+'/'+places.length;
}
if(session!==mapSession||!map)return;
status.textContent=markers.length===places.length?'':'일부 장소는 검색되지 않아 지도에서 생략되었습니다.';
if(markers.length){
const bounds=new maplibregl.LngLatBounds();
markers.forEach(m=>bounds.extend(m.coords));
map.fitBounds(bounds,{padding:65,maxZoom:15,duration:650});
}
}
function focusPlace(id){
activePlace=id;
const p=PLACES[sid].find(x=>x[0]===id);
const m=markers.find(x=>x.id===id);
if(!p)return;
if(m&&map){
map.flyTo({
center:m.coords,
zoom:Math.max(map.getZoom(),16),
essential:true
});
new maplibregl.Popup({offset:28})
.setLngLat(m.coords)
.setHTML('<strong>'+esc(p[1])+'</strong><p style="font-size:12px">'+esc(p[4])+'</p>')
.addTo(map);
}
renderPlaces();
}
function renderPlaces(){
const root=document.getElementById('places');
if(!root||!sid)return;
const q=(document.getElementById('placequery')?.value||'').toLowerCase().trim();
const cat=document.getElementById('placecat')?.value||'전체';
const filtered=PLACES[sid].filter(p=>
(cat==='전체'||p[2]===cat)&&p[1].toLowerCase().includes(q)
);
root.innerHTML=filtered.map(p=>`
<button class="place ${activePlace===p[0]?'selected':''}" onclick="focusPlace('${p[0]}')">
<small>${p[2]}</small>
<strong>${esc(p[1])}</strong>
<p>${esc(p[4])}</p>
</button>`).join('')||'<p>검색 결과가 없습니다.</p>';
}
portal();
</script>
</body>
</html>
