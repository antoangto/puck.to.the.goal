
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>퍽을 향해! | 北嶺学園 × 虎牙学園</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:#26323a}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible{outline:3px solid #78bde9;outline-offset:3px}
img{display:block;max-width:100%}
p{line-height:1.85}
.wrap{width:min(1160px,calc(100% - 36px));margin:auto}
.hidden{display:none!important}
.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.section{margin:30px 0}
.section-title{font-size:25px;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #9daeb8}
.panel{border:1px solid #d9e0e3;background:#fff;padding:23px;min-width:0}
.panel h3{margin-top:0}
.panel p{font-size:13px;color:#687983}
.photo{width:100%;height:auto;object-fit:contain}
.photo-caption{font-size:12px;color:#85929b;margin:10px 0}
.action{padding:12px 20px;background:transparent;border:1px solid currentColor;font-weight:800}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:14px;border-bottom:1px solid #d8e0e4;text-align:left;line-height:1.7}
.table th{width:135px}
.note{padding:20px 23px;line-height:1.9;font-size:13px}
.footer{padding:22px 0;margin-top:24px}
.footer p{font-size:12px}

/* ==================================
   학교 선택 첫 화면: 세로 50:50 분할
================================== */
#portal{
min-height:100svh;
background:linear-gradient(105deg,#142e43 0%,#31516a 25%,#47434b 49%,#633b31 68%,#b96027 100%);
color:#fff;
position:relative;
overflow:hidden;
}
.portal-top{
position:absolute;
top:0;left:0;right:0;
z-index:5;
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 32px;
font-size:11px;
font-weight:800;
letter-spacing:.16em;
pointer-events:none;
}
.portal-top span:last-child{opacity:.65}
.portal-split{
display:grid;
grid-template-columns:minmax(0,1fr) minmax(0,1fr);
min-height:100svh;
}
.portal-side{
position:relative;
border:0;
color:#fff;
min-width:0;
padding:90px 24px 70px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
isolation:isolate;
transition:filter .3s ease;
background:transparent;
}
.portal-side:hover{filter:brightness(1.12)}
.portal-side::before{
content:"";
position:absolute;
inset:0;
z-index:-2;
}
.portal-side::after{
content:"";
position:absolute;
inset:0;
z-index:-1;
opacity:.32;
background:radial-gradient(circle at 50% 44%,#ffffff18,transparent 55%);
}
.portal-h::before{
background:
linear-gradient(90deg,#142e430a 0%,#142e4300 100%);
}
.portal-k::before{
background:
linear-gradient(90deg,#00000000 0%,#00000012 100%);
}
.portal-side+.portal-side{border-left:0}
.portal-content{
position:relative;
z-index:2;
width:100%;
display:flex;
flex-direction:column;
align-items:center;
}
.portal-content .eyebrow{opacity:.8}
.portal-crest{
width:clamp(125px,19vw,235px);
height:clamp(125px,19vw,235px);
object-fit:contain;
margin:32px auto 22px;
filter:drop-shadow(0 14px 22px #0006);
transition:transform .35s ease;
}
.portal-side:hover .portal-crest{transform:translateY(-7px) scale(1.04)}
.portal-content h2{
font-size:clamp(25px,3.3vw,47px);
line-height:1.4;
margin:0;
font-weight:900;
}
.portal-h .portal-content h2{font-family:'Noto Serif JP',serif;font-weight:600}
.portal-content .school-en{
font-size:11px;
letter-spacing:.18em;
margin:10px 0;
opacity:.75;
}
.portal-content .school-copy{
font-size:13px;
margin:15px 0 27px;
color:#fff;
opacity:.88;
}
.portal-enter{
border:1px solid #ffffff9a;
padding:13px 27px;
font-size:12px;
font-weight:900;
letter-spacing:.08em;
background:#ffffff12;
backdrop-filter:blur(5px);
}
.portal-k .portal-enter{border-color:#ffad69;color:#ffc392}
.portal-vs{
position:absolute;
z-index:6;
left:50%;top:50%;
transform:translate(-50%,-50%);
width:85px;height:85px;
border:1px solid #ffffff65;
border-radius:50%;
background:#131c26d9;
display:grid;
place-items:center;
font-size:27px;
font-style:italic;
font-weight:900;
letter-spacing:-.06em;
box-shadow:0 8px 35px #0007;
pointer-events:none;
}
.portal-bottom{
position:absolute;
bottom:19px;left:0;right:0;
z-index:4;
text-align:center;
font-size:10px;
letter-spacing:.2em;
opacity:.75;
pointer-events:none;
}

/* ==================================
   호쿠레이 사이트
================================== */
#site{min-height:100vh}
#site.h{background:#f9f7f0;color:#263744;--accent:#244b67}
#site.k{background:#111416;color:#f4f5f5;--accent:#f47a22}
.h-top{background:#19374d;color:white;padding:10px 0;font-size:11px}
.h-top .wrap{display:flex;justify-content:space-between;gap:12px}
.h-top button{background:none;border:0;color:white}
.h-brand{background:#fffdf8;padding:28px 0}
.h-brand .wrap{display:flex;align-items:center;gap:22px}
.h-brand img{width:84px;height:84px;object-fit:contain}
.h-brand h1{font:600 30px 'Noto Serif JP',serif;margin:0}
.h-brand p{font-size:11px;letter-spacing:.15em;color:#84929a;margin:6px 0}
.h-nav{background:#254963;border-bottom:5px solid #8d3a49}
.h-nav .wrap{display:flex;flex-wrap:wrap;justify-content:center}
.h-nav button{
background:none;color:white;border:0;
border-right:1px solid #ffffff25;
padding:15px 12px;font-size:12px;font-weight:800;flex:1 1 auto
}
.h-nav button.active,.h-nav button:hover{background:#17344b}
.h-hero{
padding:80px 0;
background:linear-gradient(90deg,#19394fec,#244b65c9),
url('https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1600') center/cover;
color:white
}
.h-hero h2{font:600 clamp(30px,5vw,52px)/1.5 'Noto Serif JP',serif}
.h-hero p{font-size:13px}
.h-title{background:#eceae1;padding:20px 0}
.h-title h2{font:600 32px 'Noto Serif JP',serif;margin:8px 0}
.h-main{padding:26px 0 12px}
.h .section-title{font-family:'Noto Serif JP',serif}
.h .section-title::before{content:"◆";font-size:12px;color:#963e50;margin-right:12px}
.h .note{background:#eeece4;border-left:4px solid #963e50}
.h .footer{background:#19374d;color:white}

/* ==================================
   코가 사이트
================================== */
.k-shell{display:grid;grid-template-columns:86px minmax(0,1fr)}
.k-rail{
position:sticky;top:0;height:100vh;
background:#080a0b;border-right:1px solid #333;
display:flex;flex-direction:column;
align-items:center;padding:18px 5px;gap:9px;overflow-y:auto;scrollbar-width:thin
}
.k-rail img{width:60px;height:66px;object-fit:contain}
.k-rail button{
writing-mode:vertical-rl;background:none;border:0;
color:#aeb2b4;padding:13px 8px;
font-size:11px;font-weight:900;letter-spacing:.12em
}
.k-rail button.active{color:#ff8d36;border-left:3px solid #ff8d36}
.k-rail .back{margin-top:auto;color:white;flex-shrink:0}
.k-head{
padding:20px 34px;background:#1a1e20;
display:flex;justify-content:space-between;align-items:center
}
.k-head strong{font-size:17px}
.k-head span{color:#f47a22;font-size:11px;letter-spacing:.12em}
.k-hero{
min-height:530px;display:flex;align-items:center;
background:linear-gradient(90deg,#0a0c0df2,#111719aa),
url('https://images.unsplash.com/photo-1515703407324-5f753afd8be8?w=1600') center/cover
}
.k-hero .wrap{padding:60px 0}
.k-hero h2{
font-size:clamp(50px,9vw,115px);
line-height:1;font-weight:900;letter-spacing:-.08em
}
.k-hero h2 em{color:#f47a22;font-style:normal}
.k-hero p{color:#c1c5c7}
.k-title{
padding:30px 0;
background:repeating-linear-gradient(-45deg,#1c2022 0 24px,#202426 24px 25px);
border-bottom:6px solid #f47a22
}
.k-title h2{font-size:clamp(35px,5vw,60px);margin:5px 0;font-weight:900}
.k-main{padding:26px 0 12px}
.k .panel{background:#1c2022;border-color:#373e41;color:white}
.k .panel p{color:#afb7bb}
.k .table th,.k .table td{border-color:#383f42}
.k .section-title{border-color:#41494d}
.k .note{background:#1d2224;border-left:4px solid #f47a22}
.k .footer{background:#080a0b;color:#e6e6e6}

/* ==================================
   공통 콘텐츠
================================== */
.news{
display:grid;grid-template-columns:110px 1fr;
gap:15px;border-bottom:1px solid #aab5bc55;
padding:17px 0;font-size:13px
}
.news time{font-weight:800;color:var(--accent)}
.coach{padding:28px;border:1px solid #aab5bc55}
.coach strong{font-size:23px}
.coach-profile{display:grid;grid-template-columns:minmax(0,1fr) 188px;gap:28px;align-items:start}
.coach-details{min-width:0}
.coach-career{margin-top:18px;padding-top:14px;border-top:1px solid #aab5bc55}
.coach-career h3{font-size:14px;margin:0 0 9px;font-weight:800}
.coach-career ul{margin:0;padding-left:19px;line-height:1.85;font-size:13px}
.coach-photo{margin:0;width:188px;justify-self:end}
.coach-photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border:1px solid #aab5bc55;background:#f1f1f1}
.coach-photo figcaption{text-align:center;font-size:11px;color:#77828b;margin-top:7px}
@media(max-width:600px){.coach{padding:17px}.coach-profile{grid-template-columns:minmax(0,1fr) 112px;gap:13px}.coach-photo{width:112px}.coach strong{font-size:19px}.coach-career ul{font-size:12px;padding-left:16px}.coach-career{margin-top:12px}}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.player{min-height:270px;perspective:1000px;cursor:pointer}
.player-inner{
position:relative;width:100%;height:100%;
min-height:270px;transition:transform .55s;
transform-style:preserve-3d
}
.player.flipped .player-inner{transform:rotateY(180deg)}
.player-front,.player-back{
position:absolute;inset:0;
backface-visibility:hidden;
padding:22px;overflow:auto;
border:1px solid #b3c2ca55
}
.h .player-front{background:#fff}
.h .player-back{background:#e8edf0}
.k .player-front{background:#1d2326}
.k .player-back{background:#242c30}
.player-back{transform:rotateY(180deg)}
.player-number{font-size:52px;font-weight:900;opacity:.16;line-height:1}
.player-name{font-size:20px;font-weight:900;margin:8px 0 3px}
.player-jp{font-size:12px;opacity:.65}
.player-role{font-size:12px;font-weight:800;color:var(--accent);margin-top:15px}
.player-info{font-size:12px;line-height:1.8}
.player-hint{font-size:10px;opacity:.55;margin-top:14px}

/* ==================================
   고정 좌표 지도
================================== */
.real-map-frame{
position:relative;border:1px solid #b6c7cc;
overflow:hidden;border-radius:12px;background:#edf0eb
}
#real-map{height:570px;width:100%}
#real-map .maplibregl-canvas{outline:none}
#real-map .maplibregl-ctrl-attrib{font-size:10px;background:#ffffffd9}
.map-note{font-size:12px;line-height:1.9;color:#84939c;margin:15px 0}
.k .map-note{color:#a5b1b6}
.map-legend{display:flex;flex-wrap:wrap;gap:10px 17px;margin:20px 0;font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.place-search{display:flex;gap:10px;margin:25px 0 18px}
.place-search input,.place-search select{
padding:12px;border:1px solid #bac6cc;
border-radius:5px;background:white;color:#25323b
}
.place-search input{flex:1;min-width:0}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.place{
background:white;color:#25323b;
border:1px solid #d2dce0;border-radius:8px;
text-align:left;padding:15px
}
.place:hover,.place.selected{
border-color:#f28b35;
box-shadow:0 0 0 2px #f28b3530
}
.place small{display:block;color:#86959d;font-size:10px}
.place strong{display:block;font-size:14px;margin:6px 0}
.place p{font-size:11px;color:#71818a;margin:0}
.k .place{background:#24292b;color:white;border-color:#3d4549}
.k .place p{color:#b0bdc3}

.fiction-pin{
--pin:#547da0;
display:flex;flex-direction:column;align-items:center;
padding:0;background:transparent;border:0;
white-space:nowrap;cursor:pointer;
filter:drop-shadow(0 2px 3px #0003)
}
.pin-name{
background:#fff;border:1px solid #d5dde1;
color:#26323b;padding:5px 8px;border-radius:5px;
font-size:11px;font-weight:900;line-height:1.3;
max-width:150px;text-align:center
}
.pin-stem{width:2px;height:8px;background:var(--pin)}
.pin-dot{
width:19px;height:19px;
border:3px solid white;border-radius:50%;
background:var(--pin);outline:1px solid #53616b
}
.fiction-pin:hover .pin-name,
.fiction-pin.selected .pin-name{
background:var(--pin);border-color:var(--pin);color:white
}
.fiction-pin.selected .pin-dot{width:23px;height:23px}
.maplibregl-popup-content{
color:#26323b;border-radius:9px;padding:15px;
max-width:240px;font-family:'Noto Sans KR',sans-serif
}
.maplibregl-popup-content strong{font-size:14px}
.maplibregl-popup-content p{font-size:11px;margin:8px 0 0}
.maplibregl-popup-close-button{font-size:19px;padding:2px 7px}

.lightbox{
position:fixed;inset:0;z-index:999;
background:#000e;display:none;
align-items:center;justify-content:center;padding:30px
}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;object-fit:contain}
.lightbox button{
position:absolute;right:18px;top:18px;
padding:10px 14px;background:white;border:0
}

@media(max-width:800px){
.grid3,.roster,.places{grid-template-columns:repeat(2,minmax(0,1fr))}
.k-shell{grid-template-columns:65px minmax(0,1fr)}
.k-rail img{width:47px}
.k-rail button{font-size:10px}
}
@media(max-width:600px){
.portal-top{padding:16px 12px;font-size:9px}
.portal-side{padding:75px 10px 65px}
.portal-crest{width:clamp(90px,29vw,145px);height:clamp(90px,29vw,145px);margin:20px auto}
.portal-content h2{font-size:clamp(17px,4.7vw,26px)}
.portal-content .eyebrow{font-size:9px}
.portal-content .school-en{font-size:9px;letter-spacing:.04em}
.portal-content .school-copy{font-size:11px;min-height:45px}
.portal-enter{padding:11px 13px;font-size:10px}
.portal-vs{width:55px;height:55px;font-size:19px}
.portal-bottom{font-size:8px}
.grid2,.grid3,.roster,.places{grid-template-columns:1fr}
.h-brand h1{font-size:19px}
.h-brand img{width:57px;height:57px}
.h-nav button{font-size:10px;padding:14px 2px}
.k-shell{grid-template-columns:52px minmax(0,1fr)}
.k-rail{padding:12px 2px}
.k-rail img{width:39px}
.k-rail button{padding:10px 5px;font-size:9px}
.k-head{padding:20px 12px}
.k-head strong{font-size:12px}
.k-head span{font-size:9px}
#real-map{height:470px}
.place-search{flex-direction:column}
.table th{width:100px}
.section{margin:18px 0}
.h-main,.k-main{padding:18px 0 5px}
.footer{margin-top:12px;padding:15px 0}
.section-title{margin-bottom:10px;padding-bottom:8px}
figure{margin:8px 0}
}

/* 소개와 시설: 테두리 카드 없이 일반 텍스트 */
.plain-info{padding:0;background:transparent;border:0;align-self:start}
.plain-info h3{font-size:16px;margin:8px 0}
.plain-info p{font-size:13px;line-height:1.8;margin:0}
.facility-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px}
.facility-item{padding:12px 0;border-bottom:1px solid #8b9aa344}
.facility-item h3{font-size:15px;margin:0 0 4px}
.facility-item p{font-size:12px;line-height:1.7;margin:0;opacity:.78}
.facility-notice{margin:20px 0 0;font-size:13px;line-height:1.8}
.player-portrait{display:block;width:100%;height:145px;object-fit:contain;margin:0 auto 7px;border-radius:4px}
.player-front:has(.player-portrait) .player-number{font-size:32px}
.player-front:has(.player-portrait) .player-name{font-size:17px}
@media(max-width:600px){
.facility-list{grid-template-columns:1fr}
.facility-item{padding:10px 0}
.plain-info{padding:0}
.player-portrait{height:165px}
}

/* 선수 카드: 사진은 이름 옆, 뒷면은 상세 설정 전체, 내부 스크롤 없음 */
.roster{align-items:stretch}
.player{min-height:0;height:auto;align-self:stretch}
.player-inner{height:auto;min-height:255px;display:grid;grid-template-columns:minmax(0,1fr);align-items:stretch}
.player-front,.player-back{position:relative;inset:auto;grid-area:1/1;overflow:visible;min-height:255px;height:100%;padding:18px;min-width:0}
.player-front{transform:rotateY(0deg)}
.player-back{transform:rotateY(180deg)}
.player-front-head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.player-front-title{min-width:0;flex:1}
.player-portrait{width:94px;height:118px;flex:0 0 94px;object-fit:cover;object-position:top center;border:1px solid #b3c2ca55;border-radius:0;margin:0;background:#fff}
.player-front:has(.player-portrait) .player-number{font-size:52px}
.player-front:has(.player-portrait) .player-name{font-size:20px}
.player-front .player-role{margin-top:12px}
.player-playstyle-label,.player-back-label{font-size:12px;font-weight:900;margin:15px 0 4px}
.player-back-label{margin-top:14px}
.player-back .player-name{margin:0 0 4px}
.player-back .player-jp{margin-bottom:10px}
.player-meta{font-size:12px;font-weight:800;line-height:1.7;opacity:1;margin:7px 0}
.player-tags{font-size:11px;line-height:1.8;font-weight:800;overflow-wrap:anywhere;margin:12px 0}
.player-info{font-size:12px;line-height:1.85;overflow-wrap:break-word}
.player-back .player-info{margin:0}
.player-hint{display:none!important}
@media(max-width:600px){.player-front,.player-back{padding:15px}.player-portrait{width:82px;height:104px;flex-basis:82px}.player-front:has(.player-portrait) .player-name{font-size:18px}}

/* 선수 카드: 동일 높이, 사진 확대, 앞면 공간 정돈 */
.roster{grid-auto-rows:1fr;align-items:stretch}
.player{height:100%;min-height:0}
.player-inner{height:100%;min-height:0}
.player-front,.player-back{height:100%;min-height:0;overflow:visible}
.player-front{display:flex;flex-direction:column;justify-content:center;gap:12px}
.player-front-head{align-items:center;gap:16px}
.player-front .player-role{margin-top:12px}
.player-front .player-playstyle-label{margin-top:4px}
.player-front .player-info{margin:0}
.player-portrait{width:132px;height:176px;flex:0 0 132px;object-fit:cover;object-position:center top}
.player-back .player-meta{margin-top:0}
@media(max-width:600px){
.player-portrait{width:112px;height:152px;flex-basis:112px}
.player-front-head{gap:10px}
}

/* 선수 카드: 앞면으로 메타·성격 태그 이동 후 높이 압축 */
.roster{grid-auto-rows:auto;align-items:stretch}
.player{min-height:0;height:100%}
.player-inner{min-height:0;height:100%}

function calendarHTML(team){
 const month=homeCalendarMonth[team],year=2020,first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();
 const cells=Array(first).fill('<span class="calendar-empty"></span>');
 for(let d=1;d<=days;d++){
  const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const ev=SCHOOL_EVENTS[team][key];
  cells.push(`<span class="${ev?'calendar-event':''}" title="${ev?ev.join(' / '):''}">${d}</span>`);
 }
 const items=Object.entries(SCHOOL_EVENTS[team]).filter(([date])=>Number(date.slice(5,7))===month+1);
 return `<div class="mini-calendar-head"><button onclick="changeHomeMonth('${team}',-1)" aria-label="이전 달">‹</button><strong>2020년 ${month+1}월</strong><button onclick="changeHomeMonth('${team}',1)" aria-label="다음 달">›</button></div><div class="mini-calendar-grid">${['일','월','화','수','목','금','토'].map(d=>`<b>${d}</b>`).join('')}${cells.join('')}</div><div class="mini-calendar-events">${items.length?items.map(([date,events])=>`<div><time>${date.slice(5).replace('-','.')}</time><span>${events.join(' · ')}</span></div>`).join(''):'<p>등록된 주요 일정이 없습니다.</p>'}</div>`;
}

function clearMap(){
mapToken++;

if(activePopup){
activePopup.remove();
activePopup=null;
}

if(realMap){
realMap.remove();
realMap=null;
}

markers=[];
activePlace=null;
}

function hideRealLabels(map){
const style=map.getStyle();

if(!style||!style.layers)return;

style.layers.forEach(layer=>{
if(layer.type==='symbol'){
try{
map.setLayoutProperty(layer.id,'visibility','none');
}catch(e){}
}
});
}

/* ==================================
   지도 생성
================================== */
function initMap(){
if(!sid||page!=='map')return;

const token=mapToken;
const container=document.getElementById('real-map');

if(!container)return;

renderPlaces();

if(typeof maplibregl==='undefined'){
container.innerHTML=
'<p style="padding:25px;color:#26323b">지도 라이브러리를 불러오지 못했습니다.</p>';
return;
}

realMap=new maplibregl.Map({
container:'real-map',
style:'https://tiles.openfreemap.org/styles/liberty',
center:CENTERS[sid],
zoom:14.5,
minZoom:11,
maxZoom:19,
pitch:0,
bearing:0,
attributionControl:true,
dragRotate:false,
touchPitch:false,
renderWorldCopies:false
});

realMap.addControl(
new maplibregl.NavigationControl({
showCompass:false,
showZoom:true
}),
'bottom-right'
);

realMap.on('load',()=>{
if(token!==mapToken||!realMap)return;

hideRealLabels(realMap);
addAllMarkers();
fitAllMarkers();
});

realMap.on('styledata',()=>{
if(token!==mapToken||!realMap)return;
hideRealLabels(realMap);
});
}

/* ==================================
   핀: 확정된 경도 / 위도에 고정
================================== */
function markerElement(place){
const element=document.createElement('button');

element.type='button';
element.className='fiction-pin';
element.style.setProperty(
'--pin',
COLORS[place[2]]||'#607080'
);

element.title=place[1];
element.setAttribute('aria-label',place[1]+' 위치 보기');

const name=document.createElement('span');
name.className='pin-name';
name.textContent=place[1];

const stem=document.createElement('span');
stem.className='pin-stem';

const dot=document.createElement('span');
dot.className='pin-dot';

element.append(name,stem,dot);

element.addEventListener('click',event=>{
event.stopPropagation();
focusPlace(place[0]);
});

return element;
}

function addAllMarkers(){
if(!realMap||!sid)return;

markers.forEach(item=>item.marker.remove());
markers=[];

PLACES[sid].forEach(place=>{
const coordinates=[
Number(place[3]),
Number(place[4])
];

if(!Number.isFinite(coordinates[0])||
!Number.isFinite(coordinates[1]))return;

const element=markerElement(place);

const marker=new maplibregl.Marker({
element,
anchor:'bottom',
offset:[0,0],
draggable:false
})
.setLngLat(coordinates)
.addTo(realMap);

markers.push({
id:place[0],
place,
coords:coordinates,
marker,
element
});
});
}

function fitAllMarkers(){
if(!realMap||markers.length===0)return;

const bounds=new maplibregl.LngLatBounds();

markers.forEach(item=>{
bounds.extend(item.coords);
});

realMap.fitBounds(bounds,{
padding:{top:85,bottom:85,left:85,right:85},
maxZoom:15,
duration:0
});
}

function focusPlace(id){
if(!sid)return;

const place=PLACES[sid].find(p=>p[0]===id);
const item=markers.find(m=>m.id===id);

if(!place)return;

activePlace=id;

markers.forEach(m=>{
m.element.classList.toggle('selected',m.id===id);
});

renderPlaces();

if(!realMap||!item)return;

if(activePopup){
activePopup.remove();
activePopup=null;
}

realMap.flyTo({
center:item.coords,
zoom:Math.max(realMap.getZoom(),16),
speed:1.2,
essential:true
});

const popupContent=document.createElement('div');

const heading=document.createElement('strong');
heading.textContent=place[1];

const desc=document.createElement('p');
desc.textContent=place[5];

popupContent.append(heading,desc);

activePopup=new maplibregl.Popup({
offset:30,
closeButton:true,
closeOnClick:true
})
.setLngLat(item.coords)
.setDOMContent(popupContent)
.addTo(realMap);
}

function renderPlaces(){
const root=document.getElementById('places');

if(!root||!sid)return;

const query=(
document.getElementById('placequery')?.value||''
).toLowerCase().trim();

const category=
document.getElementById('placecat')?.value||'전체';

const filtered=PLACES[sid].filter(place=>{
const categoryMatch=
category==='전체'||place[2]===category;

const nameMatch=
place[1].toLowerCase().includes(query);

return categoryMatch&&nameMatch;
});

root.innerHTML=filtered.map(place=>`
<button
class="place ${activePlace===place[0]?'selected':''}"
onclick="focusPlace('${place[0]}')">

<small>${place[2]}</small>
<strong>${esc(place[1])}</strong>
<p>${esc(place[5])}</p>

</button>
`).join('')||'<p>검색 결과가 없습니다.</p>';
}

portal();
</script>
