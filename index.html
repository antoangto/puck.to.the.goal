function escapeHTML(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function imageBox(src,alt,cls=""){
 return `<div class="image-box ${cls}">
   <img src="${src}" alt="${escapeHTML(alt)}" loading="lazy"
    onerror="this.parentElement.classList.add('failed')"
    onclick="openLightbox(this.src)" style="cursor:zoom-in">
   <div class="image-fallback">
    <strong>이미지를 불러오지 못했습니다.</strong>
    <a href="${src}" target="_blank" rel="noopener">원본 이미지 확인 ↗</a>
   </div>
 </div>`;
}
function openLightbox(src){
 document.getElementById("lightboxImage").src=src;
 document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
 document.getElementById("lightbox").classList.remove("open");
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeLightbox();
});

function initMap(){
 if(typeof L==="undefined"){
  document.getElementById("realMap").innerHTML=
   '<p style="padding:25px">지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</p>';
  renderPlaceList(SCHOOLS[currentSchool].places);
  return;
 }
 const s=SCHOOLS[currentSchool];
 map=L.map("realMap",{scrollWheelZoom:true,zoomControl:true})
   .setView(s.mapCenter,s.zoom);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>'
 }).addTo(map);
 updateMarkers(s.places);
 renderPlaceList(s.places);
 setTimeout(()=>map&&map.invalidateSize(),200);
}
function pinIcon(place){
 const k=currentSchool==="koga";
 const symbols={"학교":"🏫","훈련":"🏒","상점":"🛍","음식점":"☕","교통":"🚌","생활":"🌳"};
 return L.divIcon({
  className:"",
  html:`<div class="map-pin ${k?"k":""}"><span>${symbols[place.cat]||"📍"}</span></div>`,
  iconSize:[34,40],iconAnchor:[16,36],popupAnchor:[0,-34]
 });
}
function updateMarkers(places){
 if(!map)return;
 mapMarkers.forEach(x=>map.removeLayer(x.marker));
 mapMarkers=[];
 places.forEach(place=>{
  const marker=L.marker([place.lat,place.lng],{icon:pinIcon(place)})
   .addTo(map)
   .bindPopup(`<strong>${escapeHTML(place.name)}</strong>
    <div>${escapeHTML(place.ko)}</div>
    <p>${escapeHTML(place.desc)}</p>`);
  marker.on("click",()=>{
   selectedPlace=place.id;
   highlightSelected();
  });
  mapMarkers.push({id:place.id,marker});
 });
}
function renderPlaceList(places){
 const el=document.getElementById("placeList");
 if(!el)return;
 if(!places.length){
  el.innerHTML='<p style="padding:20px;color:#84909a;font-size:12px">검색 결과가 없습니다.</p>';
  return;
 }
 el.innerHTML=places.map(p=>`
  <button class="place-item ${selectedPlace===p.id?"selected":""}"
    onclick="focusPlace('${p.id}')">
   <span class="type">${escapeHTML(p.cat)} / ${escapeHTML(p.name)}</span>
   <strong>${escapeHTML(p.ko)}</strong>
   <p>${escapeHTML(p.desc)}</p>
  </button>`).join("");
}
function highlightSelected(){
 const s=SCHOOLS[currentSchool];
 const q=document.getElementById("placeSearch")?.value.trim().toLowerCase()||"";
 const c=document.getElementById("placeCategory")?.value||"all";
 const filtered=s.places.filter(p=>
  (c==="all"||p.cat===c)&&
  (p.name.toLowerCase().includes(q)||p.ko.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q))
 );
 renderPlaceList(filtered);
}
function focusPlace(id){
 const s=SCHOOLS[currentSchool];
 const p=s.places.find(x=>x.id===id);
 if(!p||!map)return;
 selectedPlace=id;
 map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),16),{duration:.65});
 const item=mapMarkers.find(x=>x.id===id);
 if(item)setTimeout(()=>item.marker.openPopup(),680);
 highlightSelected();
}
function filterPlaces(){
 const s=SCHOOLS[currentSchool];
 const q=document.getElementById("placeSearch").value.trim().toLowerCase();
 const c=document.getElementById("placeCategory").value;
 const filtered=s.places.filter(p=>
  (c==="all"||p.cat===c)&&
  (p.name.toLowerCase().includes(q)||p.ko.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q))
 );
 updateMarkers(filtered);
 renderPlaceList(filtered);
}
function resetMap(){
 if(!map)return;
 const s=SCHOOLS[currentSchool];
 map.flyTo(s.mapCenter,s.zoom);
 selectedPlace=null;
 document.getElementById("placeSearch").value="";
 document.getElementById("placeCategory").value="all";
 updateMarkers(s.places);
 renderPlaceList(s.places);
}
</script>
