let school=null;

function esc(v){
return String(v).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

function title(t){
return `<h2 class="heading">${t}</h2>`;
}

function picture(key,caption){
return `<figure class="picture">
<img src="${asset(S[school].images[key])}"
alt="${esc(caption)}"
onclick="showImage(this.src)"
onerror="this.parentElement.classList.add('failed')">
<div class="missing">이미지를 불러오지 못했습니다.</div>
<figcaption>${esc(caption)}</figcaption>
</figure>`;
}

function showImage(src){
document.getElementById("lightboxImage").src=src;
document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){
document.getElementById("lightbox").classList.remove("open");
}

function portal(){
document.getElementById("choices").innerHTML=
Object.entries(S).map(([id,s])=>`
<button class="choice ${id}" onclick="openSchool('${id}')">
<div class="cover">
<img src="${asset(s.images.logo)}" alt="">
</div>
<div class="info">
<small>${s.en}</small>
<h2>${s.name}</h2>
<p>${s.jp} · ${id==="h"?"釧路":"札幌"}</p>
<b>공식 홈페이지 방문 →</b>
</div>
</button>`).join("");
}

function openSchool(id){
school=id;
page="home";
document.getElementById("portal").classList.add("hidden");
document.getElementById("site").classList.remove("hidden");
render();
scrollTo(0,0);
}

function backPortal(){
school=null;
document.getElementById("site").classList.add("hidden");
document.getElementById("portal").classList.remove("hidden");
scrollTo(0,0);
}

function go(p){
page=p;
render();
scrollTo(0,0);
}

function rect(x,y,w,h,fill,stroke="none",radius=3){
return `<rect x="${x}" y="${y}"
width="${w}" height="${h}" rx="${radius}"
fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
}

function lineDist(x,y,a,b){
const dx=b[0]-a[0],dy=b[1]-a[1];
const t=Math.max(0,Math.min(1,
((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1)));
return Math.hypot(
x-(a[0]+dx*t),
y-(a[1]+dy*t)
);
}

/* Exact distance between a road segment
   and a rectangular building parcel */
function pointRectDist(px,py,x,y,w,h){
return Math.hypot(
Math.max(x-px,0,px-x-w),
Math.max(y-py,0,py-y-h)
);
}

function segmentIntersects(a,b,c,d){
const cross=(p,q,r)=>
(q[0]-p[0])*(r[1]-p[1])-
(q[1]-p[1])*(r[0]-p[0]);

const p=cross(a,b,c);
const q=cross(a,b,d);
const u=cross(c,d,a);
const v=cross(c,d,b);

return (
((p>=0&&q<=0)||(p<=0&&q>=0))&&
((u>=0&&v<=0)||(u<=0&&v>=0))
);
}

function segmentRectDist(a,b,x,y,w,h){
const corners=[
[x,y],[x+w,y],
[x+w,y+h],[x,y+h]
];

if(pointRectDist(...a,x,y,w,h)===0)return 0;
if(pointRectDist(...b,x,y,w,h)===0)return 0;

for(let i=0;i<4;i++){
if(segmentIntersects(
a,b,corners[i],corners[(i+1)%4]
))return 0;
}

return Math.min(
...corners.map(p=>lineDist(p[0],p[1],a,b)),
pointRectDist(a[0],a[1],x,y,w,h),
pointRectDist(b[0],b[1],x,y,w,h)
);
}

function rectOverlap(x,y,w,h,b,pad=0){
return (
x<b[1]+b[3]+pad &&
x+w>b[1]-pad &&
y<b[2]+b[4]+pad &&
y+h>b[2]-pad
);
}

/* Buildings must stay away from roads
   and reserved school/park/rink parcels */
function blocked(x,y,w,h,m){
if(m.special.some(b=>rectOverlap(x,y,w,h,b,26)))
return true;

return m.roads.some(([a,b,width])=>
segmentRectDist(a,b,x,y,w,h)<width/2+26
);
}

function overlapsBox(a,b,pad=16){
return (
a.x<b.x+b.w+pad &&
a.x+a.w>b.x-pad &&
a.y<b.y+b.h+pad &&
a.y+a.h>b.y-pad
);
}

function safeBuilding(x,y,w,h,m,occupied){
const radii=[0,40,80,120,180,250,340,440,550];

for(const radius of radii){
for(let angle=0;angle<360;angle+=20){
const rad=angle*Math.PI/180;

const bx=Math.round(
x-w/2+radius*Math.cos(rad)
);
const by=Math.round(
y-h/2+radius*Math.sin(rad)
);

if(bx<25||by<25||bx+w>2975||by+h>2075)
continue;

if(blocked(bx,by,w,h,m))
continue;

const box={x:bx,y:by,w,h};

if(occupied.some(other=>overlapsBox(box,other,18)))
continue;

return box;
}
}
return null;
}

function buildMap(){
const m=MAP[school];
const h=school==="h";
const out=[];

const namedBuildings=[
"shop","cafe","market","food",
"sports","book","dorm"
];

const occupied=[];
const anchors=new Map();

/* Reserve named businesses before generating
   ordinary buildings */
for(const p of m.places){
if(!namedBuildings.includes(p[0]))continue;

const b=safeBuilding(
p[3],p[4],125,75,m,occupied
);

if(b){
occupied.push(b);
anchors.set(p[0],b);
}
}

out.push(rect(
0,0,3000,2100,
h?"#e4ebdf":"#e6e7e5"
));

/* Roads */
m.roads.forEach(([a,b,w])=>{
out.push(`
<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="${h?"#c4d0ca":"#bdc2c4"}"
stroke-width="${w+16}"
stroke-linecap="round"/>`);

out.push(`
<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="${h?"#faf8f1":"#fafaf8"}"
stroke-width="${w}"/>`);

if(!h){
out.push(`
<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="#d3d5d3"
stroke-width="3"
stroke-dasharray="20 25"/>`);
}
});

/* Ordinary buildings */
let index=0;

for(let gy=70;gy<2040;gy+=(h?125:145)){
for(let gx=65;gx<2930;gx+=(h?135:145)){

const x=gx+(index*37)%25;
const y=gy+(index*23)%21;
const w=h?76+(index%3)*13:94+(index%3)*10;
const ht=h?61+(index%4)*10:85+(index%4)*8;

index++;

if(blocked(x,y,w,ht,m))continue;

const box={x,y,w,h:ht};

if(occupied.some(b=>overlapsBox(box,b)))
continue;

const colors=h?
["#d8d8ca","#e4dfd0","#d1dad7","#e5e1d5"]:
["#c4cdd1","#d5d9db","#bdc7cc","#d9dcdc"];

out.push(rect(
x,y,w,ht,colors[index%4],
h?"#bdc8c1":"#aebac0",
h?5:1
));

if(h){
out.push(`
<path d="M${x+9} ${y+13} H${x+w-9}"
stroke="#b5bcb6" stroke-width="3"/>`);
}else{
for(let n=0;n<3;n++){
out.push(`
<path d="M${x+12} ${y+18+n*20}
H${x+w-12}"
stroke="#a8b7bf" stroke-width="3"/>`);
}
}
}
}

/* School, rink and park parcels */
m.special.forEach(([kind,x,y,w,ht])=>{
if(kind==="park"){
out.push(rect(
x,y,w,ht,
h?"#c7dfbd":"#d0dfc8",
"#a7c49e",9
));

out.push(`
<path d="M${x+25} ${y+ht*.55}
Q${x+w*.4} ${y+20}
${x+w-25} ${y+ht*.6}"
stroke="#f6f0dd"
fill="none" stroke-width="17"/>`);

for(let j=0;j<8;j++){
const tx=x+35+(j*71)%(w-65);
const ty=y+30+(j*83)%(ht-60);

out.push(`
<circle cx="${tx}" cy="${ty}" r="16"
fill="${j%2?"#94bb85":"#a5c994"}"/>`);
}
return;
}

if(kind==="school"){
out.push(rect(
x,y,w,ht,
h?"#e2e9e5":"#dce5e8",
"#88a8b8",8
));

out.push(rect(
x+24,y+25,w*.42,ht*.48,
h?"#afc1cb":"#b2c0c8",
"#90a7b3"
));

out.push(rect(
x+24,y+ht*.7,w*.48,ht*.17,
h?"#d8d0ad":"#a6b7c1",
"#9fb3b6"
));

out.push(`
<text x="${x+22}" y="${y+ht-14}"
font-size="23" fill="#536a75"
font-weight="800">SCHOOL</text>`);
return;
}

if(kind==="rink"){
out.push(rect(
x,y,w,ht,
h?"#d5e4e9":"#c4d4dd",
"#8ba8b9",9
));

out.push(rect(
x+15,y+15,w-30,ht-30,
"#c5e5ef","#8ab8c9",18
));

out.push(`
<line x1="${x+w/2}" y1="${y+15}"
x2="${x+w/2}" y2="${y+ht-15}"
stroke="#d36b72" stroke-width="4"/>`);

out.push(`
<circle cx="${x+w/2}" cy="${y+ht/2}"
r="24" fill="none"
stroke="#82a9c0" stroke-width="3"/>`);
}
});

/* Named buildings in safe parcels */
m.places.forEach(([id,name,cat])=>{
const b=anchors.get(id);
if(!b)return;

out.push(rect(
b.x,b.y,b.w,b.h,

cat==="학교"?"DORM":"SHOP";

out.push(`
<text x="${b.x+b.w/2}"
y="${b.y+b.h-15}"
text-anchor="middle"

});

/* Pins */
m.places.forEach(([id,name,cat,px,py])=>{
const parcel=anchors.get(id);
const x=parcel?parcel.x+parcel.w/2:px;
const y=parcel?parcel.y+parcel.h/2:py;

const color=cat==="학교"?"#244b70":
cat==="훈련"?"#e4772b":
cat==="교통"?"#5c7e9c":
cat==="생활"?"#4b8a6c":"#967044";

out.push(`
<g class="pin" data-id="${id}"
style="cursor:pointer">
<circle cx="${x}" cy="${y}"

<circle cx="${x}" cy="${y}"

<text x="${x}" y="${y-39}"
text-anchor="middle"

});

m.anchors=anchors;

const svg=document.getElementById("mapsvg");
svg.innerHTML=out.join("");

svg.querySelectorAll(".pin").forEach(pin=>{
pin.addEventListener("click",e=>{

}

function initMap(){

cx:school==="h"?1250:1470,

};

function dimensions(){
const el=document.getElementById("mapview");
const aspect=el.clientWidth/Math.max(1,el.clientHeight);
const world=3000/2100;

let w,h;

if(aspect>world){
w=3000;
h=w/aspect;
}else{
h=2100;
w=h*aspect;
}

return {w:w/camera.z,h:h/camera.z};
}

function updateMap(){
if(!camera)return;

camera.z=Math.max(1,Math.min(7,camera.z));

const {w,h}=dimensions();

camera.cx=Math.max(
w/2,Math.min(3000-w/2,camera.cx)
);
camera.cy=Math.max(
h/2,Math.min(2100-h/2,camera.cy)
);

const svg=document.getElementById("mapsvg");

if(svg){
svg.setAttribute(
"viewBox",
`${camera.cx-w/2} ${camera.cy-h/2} ${w} ${h}`
);
}
}

function zoomMap(factor,anchor){
if(!camera)return;

const before=dimensions();
const left=camera.cx-before.w/2;
const top=camera.cy-before.h/2;

camera.z=Math.max(
1,Math.min(7,camera.z*factor)
);

if(anchor){
const after=dimensions();

camera.cx=
left+anchor.x*before.w+
(0.5-anchor.x)*after.w;

camera.cy=
top+anchor.y*before.h+
(0.5-anchor.y)*after.h;
}

updateMap();
}

function resetMap(){
camera={
cx:school==="h"?1250:1470,
cy:school==="h"?950:900,
z:2.2
};

selected=null;

document.getElementById("mappop")
.classList.add("hidden");

updateMap();
renderPlaces();
}

function focusPlace(id){
const p=MAP[school].places.find(v=>v[0]===id);
if(!p)return;

selected=id;
camera.z=3.1;

const b=MAP[school].anchors?.get(id);

camera.cx=b?b.x+b.w/2:p[3];
camera.cy=b?b.y+b.h/2:p[4];

updateMap();

const pop=document.getElementById("mappop");

pop.innerHTML=`
<strong>${esc(p[1])}</strong>
<p>${esc(p[5])}</p>`;

pop.classList.remove("hidden");

renderPlaces();
}

function renderPlaces(){
const box=document.getElementById("places");
if(!box)return;

const q=(
document.getElementById("placequery")?.value||""
).trim().toLowerCase();

const cat=
document.getElementById("placecat")?.value||"전체";

const arr=MAP[school].places.filter(p=>
(cat==="전체"||cat===p[2])&&
p[1].toLowerCase().includes(q)
);

box.innerHTML=arr.length?
arr.map(p=>`
<button class="place ${selected===p[0]?"selected":""}"
onclick="focusPlace('${p[0]}')">
<small>${p[2]}</small>
<strong>${esc(p[1])}</strong>
<p>${esc(p[5])}</p>
</button>`).join(""):
"<p>검색 결과가 없습니다.</p>";
}

function attachMap(){
const el=document.getElementById("mapview");
const points=new Map();

let last=null;
let lastDist=null;

el.addEventListener("pointerdown",e=>{
el.setPointerCapture(e.pointerId);
points.set(e.pointerId,{
x:e.clientX,y:e.clientY
});
last={x:e.clientX,y:e.clientY};
});

el.addEventListener("pointermove",e=>{
if(!points.has(e.pointerId))return;

points.set(e.pointerId,{
x:e.clientX,y:e.clientY
});

if(points.size===2){
const a=[...points.values()];

const dist=Math.hypot(
a[0].x-a[1].x,
a[0].y-a[1].y
);

if(lastDist)zoomMap(dist/lastDist);

lastDist=dist;
last=null;
return;
}

lastDist=null;

if(!last){
last={x:e.clientX,y:e.clientY};
return;
}

const d=dimensions();
const r=el.getBoundingClientRect();

camera.cx-=
(e.clientX-last.x)/r.width*d.w;

camera.cy-=
(e.clientY-last.y)/r.height*d.h;

last={x:e.clientX,y:e.clientY};

updateMap();
});

const end=e=>{
points.delete(e.pointerId);
last=null;
lastDist=null;
};

el.addEventListener("pointerup",end);
el.addEventListener("pointercancel",end);
el.addEventListener("lostpointercapture",end);

el.addEventListener("wheel",e=>{
e.preventDefault();

const r=el.getBoundingClientRect();

zoomMap(e.deltaY<0?1.15:1/1.15,{
x:(e.clientX-r.left)/r.width,
y:(e.clientY-r.top)/r.height
});
},{passive:false});
}

window.addEventListener("resize",()=>{
if(page==="map"&&camera)updateMap();
});

portal();
</script>
</body>
</html>
