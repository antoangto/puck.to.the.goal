/*
핵심 수정:
지도 뷰포트의 실제 가로세로 비율에 맞춰
viewBox 크기를 계산한다.

최대 축소 시에도:
viewBox 너비 <= 지도 전체 너비
viewBox 높이 <= 지도 전체 높이

따라서 빈 배경이 드러나지 않는다.
*/

function mapRatio(){
 const vp=document.getElementById("mapViewport");
 if(!vp)return 1.6;
 const r=vp.getBoundingClientRect();
 return r.width/Math.max(1,r.height);
}

function maxVisibleWidth(){
 const ratio=mapRatio();
 return Math.min(MAP_W,MAP_H*ratio);
}

function clampMap(){
 if(!mapState)return;

 const s=mapState;
 const ratio=mapRatio();

 s.w=Math.min(maxVisibleWidth(),Math.max(300,s.w));
 s.h=s.w/ratio;

 s.x=Math.max(0,Math.min(MAP_W-s.w,s.x));
 s.y=Math.max(0,Math.min(MAP_H-s.h,s.y));
}

function updateMap(){
 const svg=document.getElementById("mapSVG");
 if(!svg||!mapState)return;

 clampMap();

 const s=mapState;
 svg.setAttribute("viewBox",`${s.x} ${s.y} ${s.w} ${s.h}`);
}

function zoomMap(factor,cx,cy){
 if(!mapState)return;

 const s=mapState;
 const oldW=s.w;
 const oldH=s.h;

 cx??=s.x+oldW/2;
 cy??=s.y+oldH/2;

 const newW=Math.min(
  maxVisibleWidth(),
  Math.max(300,oldW/factor)
 );
 const newH=newW/mapRatio();

 s.x=cx-(cx-s.x)*newW/oldW;
 s.y=cy-(cy-s.y)*newH/oldH;
 s.w=newW;
 s.h=newH;

 updateMap();
}

function resetMap(){
 const width=Math.min(1250,maxVisibleWidth());
 const height=width/mapRatio();

 mapState={
  x:1600-width/2,
  y:1200-height/2,
  w:width,
  h:height
 };

 selectedPlace=null;

 const popup=document.getElementById("mapPopup");
 if(popup)popup.hidden=true;

 updateMap();
 renderPlaces();
}

function focusPlace(id,scroll=true){
 const p=MAP_DATA[school].places.find(v=>v[0]===id);
 if(!p||!mapState)return;

 selectedPlace=id;

 const width=Math.min(800,maxVisibleWidth());
 const height=width/mapRatio();

 mapState={
  x:p[3]-width/2,
  y:p[4]-height/2,
  w:width,
  h:height
 };

 updateMap();

 const popup=document.getElementById("mapPopup");
 popup.hidden=false;
 popup.innerHTML=`
  <button onclick="document.getElementById('mapPopup').hidden=true">✕</button>
  <strong>${esc(p[1])}</strong>
  <p>${esc(p[5])}</p>`;

 renderPlaces();

 if(scroll){
  document.getElementById("mapViewport").scrollIntoView({
   behavior:"smooth",
   block:"center"
  });
 }
}

function renderPlaces(){
 const el=document.getElementById("places");
 if(!el)return;

 const q=(document.getElementById("placeSearch")?.value||"").trim();
 const list=MAP_DATA[school].places.filter(p=>p[1].includes(q));

 el.innerHTML=list.map(p=>`
  <button class="place ${selectedPlace===p[0]?"active":""}"
   onclick="focusPlace('${p[0]}')">
   <small>${p[2]}</small>
   <strong>${p[1]}</strong>
   <p>${p[5]}</p>
  </button>
 `).join("")||'<p class="muted">검색 결과가 없습니다.</p>';
}

function initMap(){
 drawMap();
 resetMap();

 const vp=document.getElementById("mapViewport");
 const pointers=new Map();

 let last=null;
 let pinchDistance=null;

 vp.addEventListener("pointerdown",e=>{
  vp.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  last={x:e.clientX,y:e.clientY};
 });

 vp.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)||!mapState)return;

  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===2){
   const a=[...pointers.values()];
   const dist=Math.hypot(
    a[0].x-a[1].x,
    a[0].y-a[1].y
   );

   if(pinchDistance&&pinchDistance>0){
    zoomMap(dist/pinchDistance);
   }

   pinchDistance=dist;
   return;
  }

  pinchDistance=null;

  if(last){
   const r=vp.getBoundingClientRect();

   mapState.x-=(e.clientX-last.x)/r.width*mapState.w;
   mapState.y-=(e.clientY-last.y)/r.height*mapState.h;

   updateMap();
   last={x:e.clientX,y:e.clientY};
  }
 });

 function endPointer(e){
  pointers.delete(e.pointerId);
  last=null;
  pinchDistance=null;
 }

 vp.addEventListener("pointerup",endPointer);
 vp.addEventListener("pointercancel",endPointer);

 vp.addEventListener("wheel",e=>{
  e.preventDefault();

  const r=vp.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width;
  const py=(e.clientY-r.top)/r.height;

  zoomMap(
   e.deltaY<0?1.18:1/1.18,
   mapState.x+px*mapState.w,
   mapState.y+py*mapState.h
  );
 },{passive:false});

 const observer=new ResizeObserver(()=>{
  if(!mapState)return;
  const cx=mapState.x+mapState.w/2;
  const cy=mapState.y+mapState.h/2;
  const ratio=mapRatio();

  mapState.w=Math.min(mapState.w,maxVisibleWidth());
  mapState.h=mapState.w/ratio;
  mapState.x=cx-mapState.w/2;
  mapState.y=cy-mapState.h/2;

  updateMap();
 });

 observer.observe(vp);
 renderPlaces();
}

renderPortal();
</script>
