
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>호쿠레이학원 · 코가학원 | 학교 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--text:#293946;--muted:#71808a;--line:#e0e6ea}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font-family:"Noto Sans KR",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
img{display:block;width:100%;height:auto}
.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
.section{padding:46px 0}
.title{font-size:25px;margin:0 0 20px}
.lead{font-size:13px;line-height:1.95;color:#637581}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:10px;letter-spacing:.14em;color:#81909a}
.grid2,.grid3{display:grid;gap:16px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{display:inline-block;border:1px solid #ccd6dd;background:white;padding:8px 12px;font-size:12px;font-weight:700;color:inherit}
.btn:hover{border-color:var(--accent)}
.panel{border:1px solid var(--line);background:white;padding:15px}
.panel h3{font-size:14px;margin:0 0 6px}
.panel p{font-size:12px;line-height:1.7;color:#6c7a83;margin:0}
.photo{margin:0}
.photo img{height:auto;cursor:zoom-in}
.photo figcaption{font-size:11px;color:#7b8891;padding:9px 0}
.photo-error{display:none;padding:16px;background:#f1f4f5;font-size:12px}
.photo.failed img{display:none}
.photo.failed .photo-error{display:block}
.divider{height:1px;background:var(--line);margin:42px 0}
.notice{padding:13px 16px;background:var(--soft);border-left:3px solid var(--accent);font-size:12px;line-height:1.8}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;line-height:1.8}
.table th{width:130px;background:#f4f6f7}
.news{display:flex;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12px}
.news time{color:var(--accent);font-weight:800;min-width:95px}

.portal{min-height:100vh;background:#f2f5f7}
.portal-top{background:white;padding:17px 0;border-bottom:1px solid var(--line)}
.portal-main{text-align:center;padding:60px 0}
.portal-main h1{font-family:"Noto Serif JP",serif;font-size:clamp(27px,4vw,40px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:35px}
.choice{text-align:left;padding:0;border:1px solid var(--line);background:white}
.choice:hover{box-shadow:0 8px 25px #0002}
.choice-art{height:210px;display:grid;place-items:center;background:linear-gradient(135deg,#173a56,#5a7d97)}
.choice.k .choice-art{background:linear-gradient(135deg,#181a1c,#56463b)}
.choice-art img{width:135px;max-height:165px;object-fit:contain}
.choice-body{padding:22px}
.choice-body h2{font-size:21px;margin:8px 0}
.choice-body p{font-size:12px;color:#75838d;line-height:1.8}

.site{display:none}
.site.h{--accent:#214865;--soft:#edf3f7;background:#fff}
.site.k{--accent:#e56d27;--soft:#fff1e7;background:#faf9f7}
.topline{background:#142f47;color:white;font-size:11px;padding:9px 0}
.k .topline{background:#202124}
.topline .wrap{display:flex;justify-content:space-between}
.topline button{border:0;background:none;color:inherit;font-size:11px}
.mast{background:white}
.mast .wrap{display:flex;align-items:center;gap:14px;padding:17px 0}
.mast img{width:55px;max-height:65px;object-fit:contain}
.mast strong{font-size:22px}
.h .mast strong{font-family:"Noto Serif JP",serif;font-weight:600}
.k .mast strong{font-weight:900}
.mast small{display:block;font-size:10px;color:#84929b}
.nav{background:#f6f8f9;border-bottom:3px solid var(--accent)}
.k .nav{background:#222;color:white;border-bottom-color:var(--accent)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{padding:14px 5px;border:0;background:transparent;color:inherit;font-size:12px;font-weight:800;white-space:normal;word-break:keep-all}
.nav button.active,.nav button:hover{background:var(--accent);color:white}
.hero{color:white;padding:80px 0;background:linear-gradient(105deg,#15344de8,#284d69b9),url("https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1400") center/cover}
.k .hero{background:linear-gradient(105deg,#17191bf0,#222222b5),url("https://images.unsplash.com/photo-1515703407324-5f753afd8be8?w=1400") center/cover}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.4}
.h .hero h1{font-family:"Noto Serif JP",serif;font-weight:500}
.k .hero h1{font-weight:900}
.hero p{font-size:13px;line-height:1.9}
.pagehead{background:var(--soft);padding:33px 0}
.k .pagehead{background:#202225;color:white}
.pagehead h1{font-size:28px;margin:5px 0}
.h .pagehead h1{font-family:"Noto Serif JP",serif}
.h .title{font-family:"Noto Serif JP",serif;border-bottom:2px solid var(--accent);padding-bottom:12px}
.k .title{font-weight:900;border-left:4px solid var(--accent);padding-left:12px}
.footer{background:#142f47;color:#e1e9ef;padding:35px 0;font-size:11px}
.k .footer{background:#1e2022}
.footer strong{font-size:18px}

/* 선수 카드 */
.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.player{perspective:1000px;height:310px;cursor:pointer}
.player-inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s}
.player.flipped .player-inner{transform:rotateY(180deg)}
.player-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:white;border:1px solid var(--line);overflow:auto}
.player-head{background:#eaf0f4;padding:20px}
.k .player-head{background:#252525;color:white}
.player-head strong{font-size:36px}
.player-body{padding:17px}
.player-body h3{font-size:17px;margin:0 0 4px}
.player-body p{font-size:11px;color:#70808a}
.player-back{transform:rotateY(180deg);padding:16px;border-top:4px solid var(--accent)}
.player-back h3{font-size:15px;margin:0 0 9px}
.player-back p{font-size:11px;line-height:1.7;margin:8px 0}
.player-back b{color:var(--accent)}
.flip-hint{font-size:10px;color:#82909a;margin-top:12px}

/* 지도 */
.map-shell{max-width:800px;margin:22px auto}
.map-box{position:relative;overflow:hidden;border:1px solid #c9d4d7;border-radius:9px;background:#e9eee5}
.map-viewport{height:470px;touch-action:none;cursor:grab;user-select:none}
.map-viewport:active{cursor:grabbing}
.map-viewport svg{width:100%;height:100%;display:block}
.map-controls{position:absolute;right:10px;top:10px;display:grid;gap:5px;z-index:3}
.map-controls button{width:36px;height:36px;border:1px solid #d4dcdf;border-radius:5px;background:white;font-size:18px}
.map-info{position:absolute;bottom:10px;left:10px;background:#fffffff0;border-radius:5px;padding:7px 10px;font-size:10px;pointer-events:none}
.map-popup{position:absolute;left:12px;top:12px;width:min(265px,calc(100% - 85px));background:#fff;box-shadow:0 3px 15px #0002;border-radius:6px;padding:13px;z-index:2}
.map-popup strong{font-size:13px}
.map-popup p{font-size:11px;line-height:1.7;color:#70808a;margin:5px 0}
.map-popup button{border:0;background:none;color:#84929a;position:absolute;right:8px;top:6px}
.map-help{font-size:11px;line-height:1.8;color:#77858e;margin-top:10px}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.place{border:1px solid var(--line);background:white;text-align:left;padding:13px;border-radius:5px}
.place.active,.place:hover{border-color:var(--accent);background:var(--soft)}
.place small{color:#7b8993;font-size:10px}
.place strong{display:block;font-size:13px;margin:4px 0}
.place p{font-size:11px;line-height:1.7;color:#70808a;margin:0}
.place-tools{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}
.place-tools input,.place-tools select{border:1px solid #ccd6dc;background:white;padding:9px;font-size:12px}
.place-tools input{flex:1;min-width:150px}
.map-legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0;font-size:11px;color:#697984}
.map-legend span{display:flex;align-items:center;gap:5px}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.lightbox{display:none;position:fixed;inset:0;background:#101820ee;z-index:999;align-items:center;justify-content:center;padding:35px 15px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:88vh;object-fit:contain}
.lightbox button{position:absolute;right:15px;top:15px;border:0;background:white;padding:10px 14px}

@media(max-width:800px){
.grid3,.players{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
.choices,.grid2,.grid3,.players,.places{grid-template-columns:1fr}
.section{padding:32px 0}
.title{font-size:21px;margin-bottom:15px}
.portal-main{padding:35px 0}
.mast strong{font-size:17px}
.mast img{width:44px}
.nav button{font-size:10px;padding:12px 2px;line-height:1.4}
.hero{padding:48px 0}
.hero h1{font-size:32px}
.panel{padding:11px 13px}
.panel h3{font-size:13px}
.panel p{font-size:11px}
.btn{padding:7px 10px;font-size:11px}
.table th{width:100px;padding:10px 8px}
.table td{padding:10px 8px}
.player{height:285px}
.map-shell{width:calc(100% - 26px)}
.map-viewport{height:360px}
.news{gap:8px}
}
</style>
</head>
<body>

<div id="portal" class="portal">
 <div class="portal-top"><div class="wrap"><b>홋카이도 고등학교 안내</b></div></div>
 <div class="portal-main wrap">
  <span class="eyebrow">SCHOOL INFORMATION</span>
  <h1>학교를 선택해 주세요</h1>
  <p class="muted small">각 학교의 홈페이지로 이동합니다.</p>
  <div id="choices" class="choices"></div>
  <p class="muted small" style="margin-top:25px">※ 《퍽을 향해!》 작품 속 가상 학교입니다.</p>
 </div>
</div>

<div id="site" class="site"></div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
 <button>✕</button>
 <img id="lightboxImg" alt="확대 이미지">
</div>

<script>
"use strict";

const BASE="https://pub-19e3891ce94f4c209eb7264ad1339087.r2.dev/%ED%8D%BD%EC%9D%84%20%ED%96%A5%ED%95%B4/";

const ASSETS={
 h:{logo:"호쿠레이_엠블럼.png",campus:"호쿠레이_캠퍼스.jpg",uniform:"호쿠레이_교복·체육복.png",jersey:"호쿠레이_유니폼.jpg",wear:"호쿠레이_유니폼2.jpg"},
 k:{logo:"코가_엠블럼.png",campus:"코가_캠퍼스.jpg",uniform:"코가_교복·체육복.png",jersey:"코가_유니폼.png",wear:"코가_유니폼2.jpg"}
};

const DATA={
 h:{
  name:"호쿠레이학원 고등학교",
  jp:"北嶺学園高等学校",
  location:"홋카이도 구시로시 미도리가오카 4초메",
  year:"1970년",
  motto:"성실 · 노력 · 협조",
  coach:"사에키 토시오 (佐伯 俊夫) · 56세",
  intro:"1970년 개교한 호쿠레이학원은 구시로의 주택가와 녹지에 자리한 사립 고등학교입니다. 지역과 함께 성장해 온 전통을 바탕으로 학업과 동아리 활동의 균형을 중요하게 생각합니다.",
  roster:[
   ["10","후지사와 소우타","藤沢 蒼太","3학년","C","주장","책임감이 강하고 동료를 챙기는 리더","경기 전체의 흐름을 읽는 센터","팀워크와 약속 / 무책임한 플레이"],
   ["17","미야자키 슈헤이","宮崎 修平","3학년","LW","레프트 윙","솔직하고 끈질긴 근성형","몸싸움과 퍽 추격에 적극적","성실한 훈련 / 쉽게 포기하는 태도"],
   ["30","아사히나 나기","朝比奈 凪","2학년","G","골텐더","온화하고 장난기 있는 성격","침착하게 골문을 지키는 골리","편안한 분위기 / 동료 비난"],
   ["4","하세가와 아오이","長谷川 葵","2학년","LD","레프트 디펜스","수줍음이 많고 신중함","안정적인 위치 선정과 수비","익숙한 사람들 / 갑작스러운 주목"],
   ["19","오가와 리쿠","小川 陸","2학년","RW","라이트 윙","활발하고 시끌벅적한 분위기 메이커","빠른 돌파와 공격 전환","활기찬 분위기 / 지나친 침묵"],
   ["6","키리시마 레이","霧島 怜","1학년","RD","라이트 디펜스","도시에서 전학 온 관찰력 있는 막내","기본기를 다지는 성장형 수비수","명확한 설명 / 이유 없는 강요"]
  ]
 },
 k:{
  name:"코가학원 고등학교",
  jp:"虎牙学園高等学校",
  location:"홋카이도 삿포로시 주오구 기타4조니시11초메",
  year:"2018년",
  motto:"도전이 미래를 바꾼다",
  coach:"나루세 켄토 (成瀬 健斗) · 41세",
  intro:"2018년 설립된 코가학원은 삿포로 도심의 현대식 사립 고등학교입니다. 학습 지원과 스포츠 교육을 결합하여 학생 개개인의 목표에 맞는 성장 환경을 제공합니다.",
  roster:[
   ["9","쿠로사키 타이가","黒崎 大河","3학년","C","주장","승부욕과 자신감이 강한 주장","공격의 중심에서 경기를 주도","자신감 있는 팀플레이 / 의욕 없는 경기"],
   ["27","이치노세 아키토","一ノ瀬 晃人","3학년","RD","라이트 디펜스","침착하고 계산적인 전략가","상대 패턴을 분석하는 수비","논리적인 전략 / 무리한 판단"],
   ["11","미나미 하루","南 晴","2학년","RW","라이트 윙","밝고 칭찬에 능한 스타 선수","공격 기회를 놓치지 않는 윙어","응원과 인정 / 팀 분위기를 해치는 말"],
   ["1","쿠라모토 세이","倉本 誠","2학년","G","골텐더","차분하고 취향이 뚜렷함","슈팅 각도를 관리하는 집중형 골리","정돈된 준비 / 무계획한 훈련"],
   ["16","츠키시로 이오리","月城 伊織","1학년","C","센터","자부심과 학습 의지가 공존하는 유망주","기술적인 판단과 공격 전개","실력 향상 / 과소평가"],
   ["10","토도 에이스케","藤堂 瑛介","1학년","LW","레프트 윙","성장 가능성이 큰 신성","적극적인 공격 참여","도전적인 플레이 / 기회 상실"]
  ]
 }
};

const NAV=[
 ["home","홈"],
 ["about","학교 소개"],
 ["campus","학교 시설"],
 ["hockey","아이스하키부"],
 ["guide","학교 안내"]
];

let school=null;
let page="home";
let mapState=null;
let selectedPlace=null;

function asset(id,key){return BASE+encodeURIComponent(ASSETS[id][key])}
function escapeHTML(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function photo(key,label){
 return `<figure class="photo">
  <img src="${asset(school,key)}" alt="${escapeHTML(label)}"
   loading="lazy" onclick="openLightbox(this.src)"
   onerror="this.parentElement.classList.add('failed')">
  <div class="photo-error">이미지를 불러오지 못했습니다.
   <a href="${asset(school,key)}" target="_blank">원본 보기</a>
  </div>
  <figcaption>${escapeHTML(label)}</figcaption>
 </figure>`;
}
function openLightbox(src){
 document.getElementById("lightboxImg").src=src;
 document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
 document.getElementById("lightbox").classList.remove("open");
}
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeLightbox();
});
function heading(t){return `<h2 class="title">${t}</h2>`}

function renderPortal(){
 document.getElementById("choices").innerHTML=["h","k"].map(id=>{
  const s=DATA[id];
  return `<button class="choice ${id}" onclick="openSchool('${id}')">
   <div class="choice-art"><img src="${asset(id,"logo")}" alt="엠블럼"></div>
   <div class="choice-body">
    <span class="eyebrow">${id==="h"?"KUSHIRO · SINCE 1970":"SAPPORO · SINCE 2018"}</span>
    <h2>${s.name}</h2>
    <p>${s.jp}<br>${s.location}</p>
    <b style="font-size:12px">학교 홈페이지 입장 →</b>
   </div>
  </button>`;
 }).join("");
}

function openSchool(id){
 school=id;page="home";
 document.getElementById("portal").style.display="none";
 document.getElementById("site").style.display="block";
 render();
}
function backPortal(){
 school=null;mapState=null;
 document.getElementById("site").style.display="none";
 document.getElementById("portal").style.display="block";
 window.scrollTo(0,0);
}
function go(p){
 page=p;mapState=null;render();window.scrollTo(0,0);
}
function render(){
 const s=DATA[school];
 const site=document.getElementById("site");
 site.className="site "+school;
 document.title=s.name+" | 학교 홈페이지";
 site.innerHTML=`
  <div class="topline">
   <div class="wrap">
    <span>${school==="h"?"구시로 · 미도리가오카":"삿포로 · 기타4조니시"}</span>
    <button onclick="backPortal()">다른 학교 보기 ↗</button>
   </div>
  </div>
  <header class="mast">
   <div class="wrap">
    <img src="${asset(school,"logo")}" alt="학교 엠블럼">
    <div><strong>${s.name}</strong><small>${s.jp}</small></div>
   </div>
  </header>
  <nav class="nav">
   <div class="wrap">
    ${NAV.map(([id,name])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${name}</button>`).join("")}
   </div>
  </nav>
  ${page==="home"?`
   <div class="hero"><div class="wrap">

function seeded(n){
 const v=Math.sin(n*127.1+78.233)*43758.5453;
 return v-Math.floor(v);
}

function rect(x,y,w,h,fill,stroke="none",r=0){
 return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;
}
function line(x1,y1,x2,y2,color,width){
 return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" stroke-linecap="round"/>`;
}

function drawMap(){
 const svg=document.getElementById("mapSVG");
 if(!svg)return;
 const h=school==="h";
 const data=MAP_DATA[school];
 const parts=[];
 const W=2400,H=1800;

 parts.push(rect(0,0,W,H,h?"#ecefe7":"#f0eee9"));

 /* 녹지와 수계 */
 if(h){
  parts.push(`<path d="M0 0 H420 Q650 210 430 480 L100 640 L0 610Z" fill="#dce9d4"/>`);
  parts.push(`<path d="M1750 0 H2400 V620 Q2150 480 2030 570 Q1820 420 1750 0Z" fill="#dce9d4"/>`);
  parts.push(`<path d="M2250 1800 H2400 V920 Q2080 1080 2070 1340Z" fill="#dce9d4"/>`);
  parts.push(`<path d="M-60 1350 Q390 1120 470 1540 T1150 1860" fill="none" stroke="#bad7e7" stroke-width="100"/>`);
  parts.push(`<path d="M-60 1350 Q390 1120 470 1540 T1150 1860" fill="none" stroke="#d2e9f1" stroke-width="75"/>`);
 }else{
  parts.push(rect(100,1140,650,520,"#e0e9d7"));
  parts.push(rect(1900,100,420,420,"#e1e9d9"));
  parts.push(rect(100,100,360,300,"#e4e8de"));
 }

 /* 가로·세로 도로: 도시별 다른 구조 */
 const xs=h?[140,350,570,790,1040,1530,1770,2020,2250]:
  [100,340,580,820,1040,1520,1760,2000,2240];
 const ys=h?[130,340,560,760,1170,1390,1600]:
  [120,330,550,1050,1270,1490,1710];

 for(const x of xs){
  parts.push(line(x,0,x,H,"#d5d8d4",46));
  parts.push(line(x,0,x,H,"#fffdf7",35));
 }
 for(const y of ys){
  parts.push(line(0,y,W,y,"#d5d8d4",46));
  parts.push(line(0,y,W,y,"#fffdf7",35));
 }

 /* 간선도로 */
 if(h){
  parts.push(`<path d="M0 980 Q450 900 760 1070 T1450 1280 T2400 1200" fill="none" stroke="#e4b874" stroke-width="70"/>`);
  parts.push(`<path d="M0 980 Q450 900 760 1070 T1450 1280 T2400 1200" fill="none" stroke="#ffe3a9" stroke-width="57"/>`);
 }else{
  parts.push(line(0,330,W,330,"#e3b66c",77));
  parts.push(line(0,330,W,330,"#ffe2a2",65));
  parts.push(line(2000,0,2000,H,"#e3b66c",75));
  parts.push(line(2000,0,2000,H,"#ffe2a2",63));
 }

 /* 학교와 공원, 링크의 부지는 건물을 그리기 전에 확보 */
 const reserved=[
  [data.school.x-35,data.school.y-35,data.school.w+70,data.school.h+70],
  ...data.places.filter(p=>p[2]==="공원"||p[2]==="훈련"&&p[0]!=="rink")
   .map(p=>[p[3]-95,p[4]-85,190,170])
 ];

 if(h)reserved.push([450,1250,320,290]);
 else reserved.push([550,1190,280,280]);

 function overlaps(x,y,w,hh){
  return reserved.some(r=>x<r[0]+r[2]&&x+w>r[0]&&y<r[1]+r[3]&&y+hh>r[1]);
 }
 function roadNear(x,y,w,hh){
  return xs.some(v=>x-16<v+25&&x+w+16>v-25)||
   ys.some(v=>y-16<v+25&&y+hh+16>v-25);
 }

 /* 촘촘한 건물: 지도 전체 범위에 생성 */
 for(let row=0;row<46;row++){
  for(let col=0;col<60;col++){
   const n=row*60+col;
   const x=18+col*40+seeded(n)*9;
   const y=16+row*39+seeded(n+100)*8;
   const w=19+seeded(n+300)*15;
   const hh=16+seeded(n+500)*16;
   if(overlaps(x,y,w,hh)||roadNear(x,y,w,hh))continue;
   if(h&&x<500&&y>1320)continue;
   if(h&&x>2000&&y<650)continue;
   const shade=seeded(n+700);
   const fill=shade<.3?"#d6d4cb":shade<.65?"#dddcd5":"#d0d5d1";
   parts.push(rect(x,y,w,hh,fill,"#c7cbc6",1));
  }
 }

 /* 골목길 */
 for(let x=230;x<2350;x+=110){
  for(let y=220;y<1780;y+=170){
   if(overlaps(x,y,55,55))continue;
   parts.push(line(x,y,x+65,y+seeded(x+y)*12,"#fffdf8",9));
  }
 }

 /* 공원 */
 for(const p of data.places.filter(p=>p[2]==="공원")){
  const [id,name,cat,x,y]=p;
  parts.push(rect(x-95,y-85,190,170,"#d6e8cc","#b9d5b3",10));
  parts.push(line(x-90,y+45,x+90,y-40,"#f7f2e4",13));
  for(let i=0;i<11;i++){
   const tx=x-75+seeded(i+x)*150;
   const ty=y-65+seeded(i+y)*130;
   parts.push(`<circle cx="${tx}" cy="${ty}" r="13" fill="#b6d6ad"/>`);
  }
 }

 /* 공용 링크 */
 if(h){
  parts.push(rect(455,1255,310,265,"#dfe5e8","#bacbd3",10));
  parts.push(rect(485,1290,250,170,"#c9e0e9","#a2b9c7",14));
  parts.push(rect(520,1320,180,110,"#e9f5f8","#c3d9e4",30));
 }

 /* 학교 부지와 건물 */
 const sc=data.school;
 parts.push(rect(sc.x,sc.y,sc.w,sc.h,h?"#dce7e6":"#dbe5e8","#a9bbc3",8));

 if(h){
  parts.push(rect(sc.x+45,sc.y+28,170,65,"#b8cbd4","#9cafb9",2));
  parts.push(rect(sc.x+45,sc.y+105,100,55,"#c0d0d8","#9cafb9",2));
  parts.push(rect(sc.x+230,sc.y+35,105,90,"#c8d5da","#9cafb9",2));
  parts.push(rect(sc.x+165,sc.y+160,165,65,"#d8d2b9","#c1bca8",3));
 }else{
  parts.push(rect(sc.x+35,sc.y+45,135,195,"#c4cdd1","#a8b8c0",3));
  parts.push(rect(sc.x+185,sc.y+45,205,105,"#bdd2dc","#96b3c1",3));
  parts.push(rect(sc.x+205,sc.y+58,165,78,"#d7eaf2","#a7c8d6",8));
  parts.push(rect(sc.x+185,sc.y+175,205,110,"#c8d0d4","#a8b8c0",3));
 }

 /* 정문과 연결 도로 */
 parts.push(line(sc.x-55,sc.y+sc.h*.58,sc.x+20,sc.y+sc.h*.58,"#fffdf8",24));

 /* 지명 */
 const labels=h?[
  ["미도리가오카",180,110],
  ["주택가",1810,1550],
  ["언덕길",1800,300]
 ]:[
  ["기타4조",150,240],
  ["주오구 서쪽",1760,1600],
  ["상업지구",170,850]
 ];
 for(const l of labels){
  parts.push(`<text x="${l[1]}" y="${l[2]}" font-size="24" fill="#87928c" font-family="Noto Sans KR">${l[0]}</text>`);
 }

 /* 장소 핀 */
 const colors={"학교":"#243f67","상점":"#db8c29","생활":"#d95145","공원":"#2c9b76","훈련":"#9055af"};
 for(const p of data.places){
  const [id,name,cat,x,y]=p;
  const c=colors[cat];
  parts.push(`<g class="map-pin" data-id="${id}" style="cursor:pointer">
   <circle cx="${x}" cy="${y}" r="17" fill="${c}" stroke="#fff" stroke-width="5"/>
   <circle cx="${x}" cy="${y}" r="5" fill="#fff"/>
   <rect x="${x-name.length*8-13}" y="${y-57}" width="${name.length*16+26}" height="29" rx="7" fill="#fff" stroke="#d5dfe2"/>
   <text x="${x}" y="${y-37}" font-size="18" font-weight="800" text-anchor="middle" fill="#293946" font-family="Noto Sans KR">${escapeHTML(name)}</text>
  </g>`);
 }

 svg.innerHTML=parts.join("");
 svg.querySelectorAll(".map-pin").forEach(el=>{
  el.addEventListener("click",e=>{
   e.stopPropagation();
   focusPlace(el.dataset.id,false);
  });
 });
 updateMap();
}

/* 이동 한계: 지도 영역 밖으로 벗어나지 않음 */
function clampMap(){
 if(!mapState)return;
 const s=mapState;
 s.w=Math.min(2400,Math.max(420,s.w));
 s.h=s.w*.75;
 if(s.h>1800){s.h=1800;s.w=2400}
 s.x=Math.max(0,Math.min(2400-s.w,s.x));
 s.y=Math.max(0,Math.min(1800-s.h,s.y));
}
function updateMap(){
 const svg=document.getElementById("mapSVG");
 if(!svg||!mapState)return;
 clampMap();
 const s=mapState;
 svg.setAttribute("viewBox",`${s.x} ${s.y} ${s.w} ${s.h}`);
}
function zoomMap(factor,cx,cy){
 if(!mapState)return;
 const s=mapState;
 cx??=s.x+s.w/2;
 cy??=s.y+s.h/2;
 const oldW=s.w,oldH=s.h;
 const newW=Math.max(420,Math.min(2400,oldW/factor));
 const newH=newW*.75;
 s.x=cx-(cx-s.x)*newW/oldW;
 s.y=cy-(cy-s.y)*newH/oldH;
 s.w=newW;s.h=newH;
 updateMap();
}
function resetMap(){
 mapState={x:550,y:350,w:1300,h:975};
 selectedPlace=null;
 const pop=document.getElementById("mapPopup");
 if(pop)pop.hidden=true;
 updateMap();
 renderPlaces();
}
function focusPlace(id,scroll=true){
 const p=MAP_DATA[school].places.find(v=>v[0]===id);
 if(!p)return;
 selectedPlace=id;
 mapState={x:p[3]-390,y:p[4]-292.5,w:780,h:585};
 updateMap();
 const pop=document.getElementById("mapPopup");
 pop.hidden=false;
 pop.innerHTML=`<button onclick="document.getElementById('mapPopup').hidden=true">✕</button>
  <strong>${escapeHTML(p[1])}</strong>
  <p>${escapeHTML(p[5])}</p>`;
 renderPlaces();
 if(scroll){
  document.getElementById("mapViewport").scrollIntoView({behavior:"smooth",block:"center"});
 }
}
function renderPlaces(){
 const el=document.getElementById("places");
 if(!el)return;
 const q=(document.getElementById("placeSearch")?.value||"").trim();
 const list=MAP_DATA[school].places.filter(p=>p[1].includes(q));
 el.innerHTML=list.map(p=>`<button class="place ${selectedPlace===p[0]?"active":""}" onclick="focusPlace('${p[0]}')">
  <small>${p[2]}</small>
  <strong>${p[1]}</strong>
  <p>${p[5]}</p>
 </button>`).join("")||'<p class="muted">검색 결과가 없습니다.</p>';
}
function initMap(){
 mapState={x:550,y:350,w:1300,h:975};
 selectedPlace=null;
 drawMap();
 renderPlaces();

 const vp=document.getElementById("mapViewport");
 let pointers=new Map();
 let last=null;
 let pinch=null;

 vp.addEventListener("pointerdown",e=>{
  vp.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  last={x:e.clientX,y:e.clientY};
 });
 vp.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===2){
   const a=[...pointers.values()];
   const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
   if(pinch)zoomMap(dist/pinch);
   pinch=dist;
   return;
  }
  pinch=null;
  if(last){
   const r=vp.getBoundingClientRect();
   mapState.x-=(e.clientX-last.x)/r.width*mapState.w;
   mapState.y-=(e.clientY-last.y)/r.height*mapState.h;
   updateMap();
   last={x:e.clientX,y:e.clientY};
  }
 });
 function end(e){
  pointers.delete(e.pointerId);
  last=null;pinch=null;
 }
 vp.addEventListener("pointerup",end);
 vp.addEventListener("pointercancel",end);

 vp.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width;
  const py=(e.clientY-r.top)/r.height;
  zoomMap(e.deltaY<0?1.18:1/1.18,
   mapState.x+px*mapState.w,
   mapState.y+py*mapState.h);
 },{passive:false});
}

renderPortal();
</script>
