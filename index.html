
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>호쿠레이학원 · 코가학원 | 학교 안내</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#263541;--muted:#687985;--line:#dfe5e9}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans KR",sans-serif;color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
img{display:block;max-width:100%;height:auto}
.wrap{width:min(1150px,calc(100% - 36px));margin:auto}
.muted{color:var(--muted)}
.tiny{font-size:11px;letter-spacing:.12em}
.section{padding:55px 0}
.heading{font-size:28px;margin:0 0 25px}
.lead{font-size:14px;line-height:2;color:#5e6e7b}
.grid2,.grid3{display:grid;gap:22px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.btn{border:1px solid #cbd5dd;background:white;padding:11px 18px;font-weight:700;color:inherit}
.box{padding:23px;border:1px solid var(--line);background:white}
.box p{font-size:13px;line-height:1.9;color:#64737e}
.media{margin:0;width:100%}
.media img{width:100%;height:auto;object-fit:initial;cursor:zoom-in}
.media figcaption{font-size:12px;color:#687985;padding:12px 0;line-height:1.8}
.media-error{display:none;background:#f0f3f5;padding:20px;font-size:12px}
.media.bad img{display:none}
.media.bad .media-error{display:block}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:15px;border-bottom:1px solid var(--line);text-align:left;line-height:1.9}
.table th{background:#f3f5f6;width:150px}
.portal{min-height:100vh;background:#f2f5f7}
.portal-bar{background:white;border-bottom:1px solid var(--line);padding:20px 0}
.portal-main{text-align:center;padding:65px 0}
.portal-main h1{font-family:"Noto Serif JP",serif;font-size:clamp(27px,4vw,42px)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:40px}
.choice{background:white;border:1px solid var(--line);padding:0;text-align:left;overflow:hidden}
.choice:hover{box-shadow:0 10px 30px #0002}
.choice-head{height:230px;display:grid;place-items:center}
.choice.h .choice-head{background:linear-gradient(130deg,#102b45,#466d89)}
.choice.k .choice-head{background:linear-gradient(130deg,#17191a,#45413d)}
.choice-head img{width:145px;max-height:175px;object-fit:contain}
.choice-info{padding:26px}
.choice-info h2{font-size:23px;margin:9px 0}
.choice-info p{font-size:13px;line-height:1.9;color:#687985}
.choice-link{border-top:1px solid var(--line);padding-top:18px;margin-top:20px;font-weight:800;font-size:13px}
.school{display:none}
.school.h{--accent:#204665;--soft:#edf3f7;background:white}
.school.k{--accent:#e86d25;--soft:#f8eee7;background:#f8f8f6}
.backbar{background:#112c45;color:#e0e9ef;padding:10px 0;font-size:11px}
.k .backbar{background:#181a1c}
.backbar .wrap{display:flex;justify-content:space-between;gap:10px}
.backbar button{background:none;border:0;color:inherit}
.school-head{background:white}
.h .school-head{padding:22px 0}
.k .school-head .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:16px 0}
.brand{display:flex;align-items:center;gap:15px}
.brand img{width:65px;height:auto;max-height:85px;object-fit:contain}
.brand strong{font-size:25px}
.h .brand strong{font-family:"Noto Serif JP",serif;font-weight:600}
.k .brand strong{font-weight:900}
.brand small{display:block;color:#84919b;font-size:10px;letter-spacing:.12em}
.h .nav{background:#f6f8f9;border-top:1px solid #e2e9ed;border-bottom:3px solid #204665}
.nav-inner{display:flex;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:17px 13px;font-size:13px;font-weight:700;color:inherit}
.h .nav button{border-left:1px solid #e2e7eb}
.nav button.active,.nav button:hover{background:var(--accent);color:white}
.k .nav-inner{gap:3px}
.k .nav button{padding:14px 10px}
.hero{color:white;padding:90px 0}
.h .hero{background:linear-gradient(110deg,#13334deb,#234e6ab8),url("https://images.unsplash.com/photo-1517299321609-52687d1bc55a?w=1400") center/cover}
.k .hero{background:linear-gradient(100deg,#171a1cf5,#252525aa),url("https://images.unsplash.com/photo-1515703407324-5f753afd8be8?w=1400") center/cover}
.hero h1{font-size:clamp(35px,5vw,60px);line-height:1.35}
.h .hero h1{font-family:"Noto Serif JP",serif;font-weight:500}
.k .hero h1{font-weight:900}
.k .hero em{color:#ff904b;font-style:normal}
.hero p{font-size:14px;line-height:2}
.page-banner{padding:38px 0;background:var(--soft)}
.page-banner h1{margin:5px 0;font-size:30px}
.h .page-banner h1{font-family:"Noto Serif JP",serif}
.k .page-banner{background:#1a1c1e;color:white}
.h .heading{font-family:"Noto Serif JP",serif;font-weight:600;border-bottom:2px solid var(--accent);padding-bottom:14px}
.k .heading{font-weight:900;border-left:5px solid var(--accent);padding-left:15px}
.news{display:grid;grid-template-columns:110px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:18px 0;font-size:13px}
.news time{color:var(--accent);font-weight:800}
.profile{background:white;border:1px solid var(--line)}
.profile-top{background:#eaf0f4;padding:23px}
.k .profile-top{background:#252525;color:white;border-left:5px solid var(--accent)}
.number{font-size:34px;font-weight:900}
.profile-body{padding:20px}
.profile-body h3{margin:0;font-size:20px}
.profile-body p{font-size:12px;color:#6d7c87}
.notice{background:var(--soft);border-left:4px solid var(--accent);padding:18px 22px;font-size:13px;line-height:2}
.footer{background:#102b43;color:#e0eaf0;padding:42px 0;font-size:12px}
.k .footer{background:#191b1d}
.footer strong{font-size:22px}

/* 지도는 페이지보다 좁게 배치 */
.map-wrap{width:min(800px,calc(100% - 36px));margin:30px auto}
.map-frame{position:relative;border:1px solid #ccd7dc;border-radius:8px;overflow:hidden;background:#e7eee5}
.map-viewport{height:480px;overflow:hidden;position:relative;touch-action:none;cursor:grab}
.map-viewport:active{cursor:grabbing}
.map-viewport svg{width:100%;height:100%;display:block}
.map-controls{position:absolute;right:12px;top:12px;z-index:5;display:grid;gap:5px}
.map-controls button{width:40px;height:40px;background:white;border:1px solid #d3dade;border-radius:5px;font-size:20px}
.map-status{position:absolute;bottom:12px;left:12px;background:#ffffffe8;padding:7px 11px;border-radius:5px;font-size:11px;pointer-events:none}
.map-pop{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 110px));background:white;border:1px solid #d9e0e5;border-radius:6px;padding:12px 15px;box-shadow:0 4px 18px #0002;z-index:4;pointer-events:none}
.map-pop strong{font-size:13px}
.map-pop p{font-size:11px;line-height:1.7;color:#667680}
.map-note{text-align:center;font-size:12px;color:#72808b;line-height:1.9}
.place-search{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
.place-search input,.place-search select{padding:12px;border:1px solid #cdd6dd;background:white;font-size:13px}
.place-search input{flex:1;min-width:170px}
.places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.place{background:white;border:1px solid #dce3e7;border-radius:5px;padding:17px 19px;text-align:left}
.place:hover,.place.selected{border-color:var(--accent);background:var(--soft)}
.place small{font-size:11px;color:#7c8993}
.place strong{display:block;margin:5px 0;font-size:14px}
.place p{font-size:12px;color:#697984;line-height:1.7;margin:0}
.lightbox{position:fixed;inset:0;background:#101820ee;display:none;align-items:center;justify-content:center;padding:40px 20px;z-index:100}
.lightbox.open{display:flex}
.lightbox img{max-height:88vh;max-width:100%;object-fit:contain}
.lightbox button{position:absolute;top:14px;right:16px;padding:10px 16px;background:white;border:0}
@media(max-width:900px){
.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
.k .school-head .wrap{display:block}
.nav-inner{flex-wrap:nowrap;overflow-x:auto}
.nav button{white-space:nowrap}
.map-viewport{height:420px}
}
@media(max-width:600px){
.choices,.grid2,.grid3,.places{grid-template-columns:1fr}
.portal-main{padding:40px 0}
.section{padding:38px 0}
.brand img{width:52px}
.brand strong{font-size:19px}
.hero{padding:55px 0}
.heading{font-size:24px}
.map-wrap{width:calc(100% - 44px)}
.map-viewport{height:350px}
.table th{width:105px;padding:12px 9px}
.table td{padding:12px 9px}
}
</style>
</head>
<body>

<div id="portal" class="portal">
  <div class="portal-bar">
    <div class="wrap"><strong>홋카이도 고등학교 안내</strong></div>
  </div>
  <div class="portal-main wrap">
    <span class="tiny muted">SCHOOL INFORMATION</span>
    <h1>학교를 선택해 주세요</h1>
    <p class="muted">각 학교의 공식 홈페이지로 이동합니다.</p>
    <div id="choices" class="choices"></div>
    <p class="muted" style="font-size:12px;margin-top:25px">
      ※ 《퍽을 향해!》 작품 속 가상 학교 홈페이지입니다.
    </p>
  </div>
</div>

<div id="site" class="school"></div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <button>✕</button>
  <img id="lightboxImg" alt="확대 이미지">
</div>

<script>
"use strict";

const BASE="https://pub-19e3891ce94f4c209eb7264ad1339087.r2.dev/%ED%8D%BD%EC%9D%84%20%ED%96%A5%ED%95%B4/";

const ASSET={
 h:{
  logo:"호쿠레이_엠블럼.png",
  campus:"호쿠레이_캠퍼스.jpg",
  uniform:"호쿠레이_교복·체육복.png",
  jersey:"호쿠레이_유니폼.jpg",
  wear:"호쿠레이_유니폼2.jpg"
 },
 k:{
  logo:"코가_엠블럼.png",
  campus:"코가_캠퍼스.jpg",
  uniform:"코가_교복·체육복.png",
  jersey:"코가_유니폼.png",
  wear:"코가_유니폼2.jpg"
 }
};

const DATA={
 h:{
  name:"호쿠레이학원 고등학교",
  jp:"北嶺学園高等学校",
  address:"홋카이도 구시로시 미도리가오카 4초메",
  founded:"1970년",
  motto:"성실 · 노력 · 협조",
  colors:"남색 · 흰색 · 진홍색",
  coach:"사에키 토시오",
  coachJP:"佐伯 俊夫",
  age:56,
  intro:"1970년 개교한 호쿠레이학원은 구시로시 미도리가오카의 주택가와 녹지에 자리한 사립 고등학교입니다. 지역과 함께 성장해 온 교육 전통을 바탕으로 학업과 동아리 활동의 균형을 중요하게 생각합니다.",
  roster:[
   ["10","후지사와 소우타","藤沢 蒼太","3학년","C","주장 · 센터"],
   ["17","미야자키 슈헤이","宮崎 修平","3학년","LW","레프트 윙"],
   ["30","아사히나 나기","朝比奈 凪","2학년","G","골텐더"],
   ["4","하세가와 아오이","長谷川 葵","2학년","LD","레프트 디펜스"],
   ["19","오가와 리쿠","小川 陸","2학년","RW","라이트 윙"],
   ["6","키리시마 레이","霧島 怜","1학년","RD","라이트 디펜스"]
  ]
 },
 k:{
  name:"코가학원 고등학교",
  jp:"虎牙学園高等学校",
  address:"홋카이도 삿포로시 주오구 기타4조니시11초메",
  founded:"2018년",
  motto:"도전이 미래를 바꾼다",
  colors:"오렌지 · 검정 · 금색",
  coach:"나루세 켄토",
  coachJP:"成瀬 健斗",
  age:41,
  intro:"2018년 설립된 코가학원은 삿포로시 주오구에 자리한 현대식 사립 고등학교입니다. 학습 지원과 스포츠 교육을 결합하여 학생 개개인의 목표에 맞는 성장 환경을 제공합니다.",
  roster:[
   ["9","쿠로사키 타이가","黒崎 大河","3학년","C","주장 · 센터"],
   ["27","이치노세 아키토","一ノ瀬 晃人","3학년","RD","라이트 디펜스"],
   ["11","미나미 하루","南 晴","2학년","RW","라이트 윙"],
   ["1","쿠라모토 세이","倉本 誠","2학년","G","골텐더"],
   ["16","츠키시로 이오리","月城 伊織","1학년","C","센터"],
   ["10","토도 에이스케","藤堂 瑛介","1학년","LW","레프트 윙"]
  ]
 }
};

const NAV=[
 ["home","홈"],
 ["about","학교 소개"],
 ["campus","학교 시설"],
 ["uniform","교복·학교생활"],
 ["hockey","아이스하키부"],
 ["players","선수 소개"],
 ["map","주변 지도"]
];

let sid=null;
let page="home";
let view=null;
let selected=null;

function url(key){
 return BASE+encodeURIComponent(ASSET[sid][key]);
}

function esc(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

function media(key,label){
 return `<figure class="media">
  <img src="${url(key)}" alt="${esc(label)}"
    loading="lazy"
    onclick="openLightbox(this.src)"
    onerror="this.parentElement.classList.add('bad')">
  <div class="media-error">
    이미지를 불러오지 못했습니다.
    <a href="${url(key)}" target="_blank">원본 확인</a>
  </div>
  <figcaption>${esc(label)}</figcaption>
 </figure>`;
}

function openLightbox(src){
 document.getElementById("lightboxImg").src=src;
 document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){
 document.getElementById("lightbox").classList.remove("open");
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeLightbox();
});

function renderPortal(){
 const choices=document.getElementById("choices");
 choices.innerHTML=["h","k"].map(id=>{
  const s=DATA[id];
  const logo=BASE+encodeURIComponent(ASSET[id].logo);
  return `<button class="choice ${id}" onclick="openSchool('${id}')">
    <div class="choice-head">
      <img src="${logo}" alt="${s.name} 엠블럼">
    </div>
    <div class="choice-info">
      <span class="tiny muted">${id==="h"?"KUSHIRO · 1970":"SAPPORO · 2018"}</span>
      <h2>${s.name}</h2>
      <p>${s.jp}<br>${s.address}</p>
      <div class="choice-link">학교 홈페이지 입장　→</div>
    </div>
  </button>`;
 }).join("");
}

function openSchool(id){
 sid=id;
 page="home";
 document.getElementById("portal").style.display="none";
 document.getElementById("site").style.display="block";
 render();
}

function backPortal(){
 sid=null;
 document.getElementById("site").style.display="none";
 document.getElementById("portal").style.display="block";
 window.scrollTo(0,0);
}

function go(p){
 page=p;
 render();
 window.scrollTo(0,0);
}

function heading(title,sub=""){
 return `<h2 class="heading">${title}</h2>
 ${sub?`<p class="tiny muted">${sub}</p>`:""}`;
}

function render(){
 const s=DATA[sid];
 const site=document.getElementById("site");
 site.className="school "+sid;

 const nav=NAV.map(([id,label])=>
  `<button class="${page===id?"active":""}"
    onclick="go('${id}')">${label}</button>`
 ).join("");

 site.innerHTML=`
  <div class="backbar">
   <div class="wrap">
    <span>${sid==="h"?"구시로 · 미도리가오카":"삿포로 · 기타4조니시"}</span>
    <button onclick="backPortal()">다른 학교 보기 ↗</button>
   </div>
  </div>
  <header class="school-head">
   <div class="wrap">
    <div class="brand">
     <img src="${url("logo")}" alt="학교 엠블럼">
     <div><strong>${s.name}</strong><small>${s.jp}</small></div>
    </div>
    ${sid==="k"?`<nav class="nav"><div class="nav-inner">${nav}</div></nav>`:""}
   </div>
  </header>
  ${sid==="h"?`<nav class="nav"><div class="wrap nav-inner">${nav}</div></nav>`:""}
  ${page==="home"?`
   <div class="hero">
    <div class="wrap">
     <span class="tiny">${sid==="h"?"SINCE 1970 · KUSHIRO":"KOGA GAKUEN · SAPPORO"}</span>
     <h1>${sid==="h"?
      "바람의 도시에서,<br>내일을 키우다.":
      "도전의 순간,<br><em>미래가 바뀐다.</em>"}</h1>
     <p>${sid==="h"?
      "전통과 배움, 그리고 함께 달리는 시간.":
      "학업과 스포츠, 두 가지 가능성을 향해."}</p>
     <button class="btn" onclick="go('about')">학교 소개 보기 →</button>
    </div>
   </div>`:`
   <div class="page-banner">
    <div class="wrap">
     <span class="tiny">SCHOOL INFORMATION</span>
     <h1>${NAV.find(x=>x[0]===page)[1]}</h1>
    </div>
   </div>`}
  <main class="section">
   <div class="wrap">${content(s)}</div>
  </main>
  <footer class="footer">
   <div class="wrap">
    <strong>${s.name}</strong>
    <p>${s.address}</p>
    <p>© 2020 ${s.jp} · 《퍽을 향해!》 가상 학교</p>
    <button class="btn" onclick="backPortal()">학교 선택으로 돌아가기</button>
   </div>
  </footer>`;

 document.title=s.name+" | 학교 홈페이지";
 if(page==="map")initMap();
}

function content(s){
 const h=sid==="h";

 if(page==="home"){
  return `
   ${heading("학교 소식")}
   ${[
    ["2020.10.16","2학기 학교 시설 이용 안내"],
    ["2020.10.08","아이스하키부 가을 훈련 일정"],
    ["2020.09.25","학교 행사 일정 변경 안내"],
    ["2020.09.01","2학기 개학 안내"]
   ].map(n=>`<div class="news"><time>${n[0]}</time><span>${n[1]}</span></div>`).join("")}
   <div style="margin-top:55px">
    ${heading("우리 학교 소개")}
    <div class="grid2">
     <div>
      <p class="lead">${s.intro}</p>
      <button class="btn" onclick="go('about')">학교 소개 자세히 보기 →</button>
     </div>
     ${media("campus","학교 캠퍼스 배치도")}
    </div>
   </div>
   <div style="margin-top:55px">
    ${heading("학교생활과 활동")}
    <div class="grid3">

 view={x:0,y:0,w:1200,h:900};

function drawMap(){
 const m=MAPS[sid];
 const h=sid==="h";
 const svg=document.getElementById("mapSvg");
 if(!svg)return;

 let a=[];
 a.push(`<rect width="1200" height="900" fill="${h?"#e9efe4":"#f1efe9"}"/>`);

 if(h){
  a.push(`<path d="M780 0 L1200 0 L1200 190 Q1050 240 1080 360 L1200 520 L1200 900 L1040 900 Q860 740 940 600 Q1040 470 870 360 Q700 250 780 0" fill="#c8ddc1"/>`);
  a.push(`<path d="M0 0 L160 0 L95 210 L0 260Z" fill="#d6e5cc"/>`);
  a.push(`<path d="M1050 0 Q1010 150 1130 280 T1150 550" fill="none" stroke="#b5d7e8" stroke-width="38"/>`);
 }else{
  a.push(`<rect x="55" y="580" width="310" height="265" fill="#d8e5d0" rx="10"/>`);
  a.push(`<rect x="805" y="95" width="340" height="255" fill="#e2e7df" rx="8"/>`);
 }

 for(const [x1,y1,x2,y2] of m.roads){
  a.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d1d4d1" stroke-width="${h?42:36}"/>`);
  a.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="${h?30:25}"/>`);
 }

 if(h){
  a.push(`<path d="M0 750 Q260 660 480 740 T1200 620" fill="none" stroke="#fff" stroke-width="24"/>`);
 }

 for(let row=0;row<10;row++){
  for(let col=0;col<14;col++){
   const x=38+col*82+(row%2)*11;
   const y=28+row*84;

   if(h&&x>800&&y<640)continue;
   if(h&&x>410&&x<720&&y>345&&y<530)continue;
   if(!h&&x>470&&x<790&&y>330&&y<570)continue;
   if(!h&&x<350&&y>590)continue;

   const w=26+(col*13+row*7)%30;
   const ht=19+(col*5+row*11)%22;

   a.push(`<rect x="${x}" y="${y}" width="${w}" height="${ht}" rx="2" fill="${h?"#d6d3c8":"#d8d9d6"}" stroke="#c4c8c5"/>`);
  }
 }

 if(h){
  a.push(`<rect x="430" y="355" width="280" height="185" rx="9" fill="#dce6e9" stroke="#9fb6c2" stroke-width="3"/>`);
  a.push(`<rect x="480" y="380" width="135" height="62" fill="#b8c8d2"/>`);
  a.push(`<rect x="615" y="465" width="67" height="48" fill="#c7d4d8"/>`);
  a.push(`<rect x="470" y="463" width="122" height="54" fill="#d9d6c3"/>`);
 }else{
  a.push(`<rect x="480" y="330" width="325" height="230" rx="8" fill="#dfe5e7" stroke="#9eafb8" stroke-width="3"/>`);
  a.push(`<rect x="505" y="355" width="120" height="120" fill="#c3cbd0"/>`);
  a.push(`<rect x="635" y="355" width="145" height="130" rx="7" fill="#c0d6e3" stroke="#8daab9" stroke-width="5"/>`);
  a.push(`<rect x="520" y="495" width="240" height="40" fill="#c5ced2"/>`);
 }

 a.push(`<g font-family="Noto Sans KR,sans-serif" font-size="19" fill="#7d8888">
  <text x="45" y="60">${h?"미도리가오카":"기타4조"}</text>
  <text x="810" y="835">${h?"구시로 시내 방향":"주오구 서쪽"}</text>
 </g>`);

 for(const p of m.places){
  const [id,name,cat,x,y]=p;
  const color=id==="school"?"#183f62":cat==="훈련"?"#d86a2b":"#497d72";

  a.push(`<g class="pin" data-id="${id}" style="cursor:pointer">
   <circle cx="${x}" cy="${y}" r="${id==="school"?20:15}"
    fill="${color}" stroke="#fff" stroke-width="4"/>
   <circle cx="${x}" cy="${y}" r="4" fill="#fff"/>
   <text x="${x}" y="${y-26}" text-anchor="middle"
    font-size="18" font-weight="800" fill="#334b59"
    stroke="#fff" stroke-width="5" paint-order="stroke"
    font-family="Noto Sans KR,sans-serif">${esc(name)}</text>
  </g>`);
 }

 svg.innerHTML=a.join("");

 svg.querySelectorAll(".pin").forEach(el=>{
  el.addEventListener("click",e=>{
   e.stopPropagation();
   focusPlace(el.dataset.id);
  });
 });

}

function updateView(){
 const svg=document.getElementById("mapSvg");
 if(svg&&view){
  svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
 }
}

function zoomMap(factor,point){
 if(!view)return;

 const oldW=view.w;
 const oldH=view.h;
 const newW=Math.max(180,Math.min(1800,oldW/factor));
 const newH=newW*.75;

 const cx=point?.x??view.x+oldW/2;
 const cy=point?.y??view.y+oldH/2;

 view.x=cx-(cx-view.x)*newW/oldW;
 view.y=cy-(cy-view.y)*newH/oldH;
 view.w=newW;
 view.h=newH;
 updateView();
}

function resetMap(){
 view={x:0,y:0,w:1200,h:900};
 selected=null;
 document.getElementById("mapPop").hidden=true;
 updateView();
 renderPlaces();
}

function focusPlace(id){
 const p=MAPS[sid].places.find(x=>x[0]===id);
 if(!p)return;

 selected=id;
 view={x:p[3]-300,y:p[4]-225,w:600,h:450};
 updateView();

 const pop=document.getElementById("mapPop");
 pop.hidden=false;
 pop.innerHTML=`<strong>${esc(p[1])}</strong><p>${esc(p[5])}</p>`;

 renderPlaces();
}

function renderPlaces(){
 const el=document.getElementById("places");
 if(!el)return;

 const q=(document.getElementById("placeSearch")?.value||"").trim().toLowerCase();
 const cat=document.getElementById("placeCategory")?.value||"전체";

 const arr=MAPS[sid].places.filter(p=>
  (cat==="전체"||p[2]===cat)&&p[1].toLowerCase().includes(q)
 );

 el.innerHTML=arr.length?arr.map(p=>`
  <button class="place ${selected===p[0]?"selected":""}"
   onclick="focusPlace('${p[0]}')">
   <small>${p[2]}</small>
   <strong>${p[1]}</strong>
   <p>${p[5]}</p>
  </button>`).join(""):`<p class="muted">검색 결과가 없습니다.</p>`;
}

function attachMapEvents(){
 const vp=document.getElementById("mapViewport");
 let last=null;
 let points=new Map();
 let pinch=null;

 vp.addEventListener("pointerdown",e=>{
  vp.setPointerCapture(e.pointerId);
  points.set(e.pointerId,{x:e.clientX,y:e.clientY});
  last={x:e.clientX,y:e.clientY};
 });

 vp.addEventListener("pointermove",e=>{
  if(!points.has(e.pointerId))return;
  points.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(points.size===2){
   const a=[...points.values()];
   const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
   if(pinch)zoomMap(dist/pinch);
   pinch=dist;
   return;
  }

  pinch=null;

  if(last){
   const r=vp.getBoundingClientRect();
   view.x-=(e.clientX-last.x)/r.width*view.w;
   view.y-=(e.clientY-last.y)/r.height*view.h;
   updateView();
   last={x:e.clientX,y:e.clientY};
  }
 });

 function end(e){
  points.delete(e.pointerId);
  last=null;
  pinch=null;
 }

 vp.addEventListener("pointerup",end);
 vp.addEventListener("pointercancel",end);

 vp.addEventListener("wheel",e=>{
  e.preventDefault();

  const r=vp.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width;
  const py=(e.clientY-r.top)/r.height;

  zoomMap(e.deltaY<0?1.16:.86,{
   x:view.x+px*view.w,
   y:view.y+py*view.h
  });
 },{passive:false});
}
