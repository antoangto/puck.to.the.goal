function esc(v){
return String(v).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

return `<h2 class="heading">${t}</h2>`;
}
function picture(key,caption){
return `<figure class="picture">
<img src="${asset(S[school].images[key])}"
alt="${esc(caption)}"
onclick="showImage(this.src)"
onerror="this.parentElement.classList.add('failed')">
<div class="missing">이미지를 불러오지 못했습니다.</div>
<figcaption>${esc(caption)}</figcaption>
</figure>`;
}
function showImage(src){

document.getElementById("lightbox").classList.add("open");

<div class="enter">ENTER WEBSITE ↗</div>
</div>
</button>`).join("");

function destroyMap(){
if(activePopup){activePopup.remove();activePopup=null}
markers.forEach(m=>m.remove());
markers=[];
if(map){map.remove();map=null}
}
function openSchool(id){
destroyMap();
school=id;
page="home";
document.getElementById("portal").classList.add("hidden");
document.getElementById("site").classList.remove("hidden");
render();
scrollTo(0,0);
}
function backPortal(){
destroyMap();
school=null;
document.getElementById("site").classList.add("hidden");
document.getElementById("portal").classList.remove("hidden");
scrollTo(0,0);
}
function go(p){
destroyMap();
page=p;
render();
scrollTo(0,0);
}

/* ===============================
   MAPLIBRE / REAL MAP
================================ */
function initMap(){
if(typeof maplibregl==="undefined"){
document.getElementById("mapview").innerHTML=
"<p style='padding:25px;color:#333'>지도 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</p>";
return;
}

const center=school==="h"
?[144.3975,42.9768]
:[141.3464,43.0604];

const bounds=school==="h"
?[[144.20,42.87],[144.55,43.10]]
:[[141.16,42.95],[141.55,43.18]];

map=new maplibregl.Map({
container:"mapview",
style:"https://tiles.openfreemap.org/styles/liberty",
center:center,
zoom:13.8,
minZoom:10,
maxZoom:18.5,
maxBounds:bounds,
renderWorldCopies:false,
attributionControl:true
});

map.touchZoomRotate.enable();
map.dragRotate.disable();
map.touchZoomRotate.disableRotation();

map.on("load",()=>{
drawMarkers();
refreshPlaces();
});
map.on("error",e=>{
console.warn("Map loading issue:",e.error);
});

renderFilters();
refreshPlaces();
}

function renderFilters(){
const box=document.getElementById("filters");
if(!box)return;
const cats=["전체",...Object.keys(COLORS)];
box.innerHTML=cats.map(cat=>`
<button class="${category===cat?'active':''}"
onclick="setCategory('${cat}')">${cat}</button>
`).join("");
}

function setCategory(cat){
category=cat;
renderFilters();
refreshPlaces();
}

function filteredPlaces(){
const q=(document.getElementById("placequery")?.value||"")
.trim().toLowerCase();
return PLACES[school].filter(p=>
(category==="전체"||p[2]===category)&&
(p[1].toLowerCase().includes(q)||p[5].toLowerCase().includes(q))
);
}

function makeMarker(p){
const el=document.createElement("button");
el.type="button";
el.className="map-pin";
el.title=p[1];
el.innerHTML=`
<span class="pin-label">${esc(p[1])}</span>
<span class="pin-shape" style="background:${COLORS[p[2]]}"></span>
`;
el.addEventListener("click",e=>{
e.stopPropagation();
focusPlace(p[0]);
});
const marker=new maplibregl.Marker({
element:el,
anchor:"bottom"
})
.setLngLat([p[3],p[4]])
.addTo(map);
markers.push({id:p[0],marker,el});
}

function drawMarkers(){
markers.forEach(m=>m.marker.remove());
markers=[];
PLACES[school].forEach(makeMarker);
refreshPlaces();
}

function refreshPlaces(){
const box=document.getElementById("places");
if(!box||!school)return;

const visible=filteredPlaces();
const ids=new Set(visible.map(p=>p[0]));

markers.forEach(({id,el})=>{
el.style.display=ids.has(id)?"flex":"none";
});

box.innerHTML=visible.length?
visible.map(p=>`
<button class="place ${selected===p[0]?'selected':''}"
onclick="focusPlace('${p[0]}')">
<small>${p[2]}</small>
<strong>${esc(p[1])}</strong>
<p>${esc(p[5])}</p>
</button>
`).join(""):
"<p>검색 결과가 없습니다.</p>";
}

function focusPlace(id){
const p=PLACES[school].find(v=>v[0]===id);
if(!p||!map)return;
selected=id;

map.flyTo({
center:[p[3],p[4]],
zoom:Math.max(map.getZoom(),15),
speed:1.2,
essential:true
});

if(activePopup)activePopup.remove();

activePopup=new maplibregl.Popup({
offset:25,
closeButton:true,
maxWidth:"260px"
})
.setLngLat([p[3],p[4]])
.setHTML(`
<strong>${esc(p[1])}</strong>
<p>${esc(p[5])}</p>
<small>작품 세계관 속 장소</small>
`)
.addTo(map);

refreshPlaces();
}

function mapZoom(direction){
if(!map)return;
map.easeTo({
zoom:map.getZoom()+direction,
duration:300
});
}

function resetMap(){
if(!map)return;
selected=null;
if(activePopup){
activePopup.remove();
activePopup=null;
}
const center=school==="h"
?[144.3975,42.9768]
:[141.3464,43.0604];
map.flyTo({
center:center,
zoom:13.8,
speed:1.1,
essential:true
});
refreshPlaces();
}

portal();
</script>
