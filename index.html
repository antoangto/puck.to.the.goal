function asset(id,key){
 return BASE+encodeURIComponent(ASSET[id][key]);
}

function esc(v){
 return String(v).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function image(key,label){
 return `<figure class="media">
  <img src="${asset(sid,key)}" alt="${esc(label)}"
   loading="lazy"
   onclick="openLightbox(this.src)"
   onerror="this.parentElement.classList.add('broken')">
  <div class="media-error">
   이미지를 불러오지 못했습니다.
   <a href="${asset(sid,key)}" target="_blank">원본 보기</a>
  </div>
  <figcaption>${esc(label)}</figcaption>
 </figure>`;
}

function openLightbox(src){
 document.getElementById("lightboxImg").src=src;
 document.getElementById("lightbox").classList.add("open");
}

function closeLightbox(){
 document.getElementById("lightbox").classList.remove("open");
}

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeLightbox();
});

function initMap(){
 const s=DATA[sid];
 selected=null;
 renderPlaces();

 if(typeof L==="undefined"){
  document.getElementById("map").innerHTML=
   '<p style="padding:25px">지도를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.</p>';
  return;
 }

 const center=s.center;

 const bounds=L.latLngBounds(
  [center[0]-.012,center[1]-.020],
  [center[0]+.012,center[1]+.020]
 );

 map=L.map("map",{
  center:center,
  zoom:16,
  minZoom:13,
  maxZoom:19,
  maxBounds:bounds,
  maxBoundsViscosity:1,
  zoomControl:true,
  scrollWheelZoom:true
 });

 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
 }).addTo(map);

 const emoji={
  "학교":"🏫",
  "훈련":"🏒",
  "상점":"🛍️",
  "음식점":"☕",
  "교통":"🚌",
  "생활":"🌳"
 };

 PLACES[sid].forEach(p=>{
  const icon=L.divIcon({
   className:"",
   html:`<div style="text-align:center">
    <div class="map-label">${emoji[p[2]]||"📍"} ${esc(p[1])}</div>
    <div style="
     width:11px;
     height:11px;
     background:${sid==="h"?"#204767":"#e76c24"};
     border:2px solid white;
     border-radius:50%;
     margin:2px auto;
     box-shadow:0 1px 4px #0005">
    </div>
   </div>`,
   iconSize:[125,48],
   iconAnchor:[62,48],
   popupAnchor:[0,-43]
  });

  const marker=L.marker([p[3],p[4]],{icon})
   .addTo(map)
   .bindPopup(`<div class="map-popup">
    <strong>${esc(p[1])}</strong>
    <p>${esc(p[5])}</p>
   </div>`);

  marker.on("click",()=>{
   selected=p[0];
   renderPlaces();
  });

  markers[p[0]]=marker;
 });

 setTimeout(()=>map&&map.invalidateSize(),150);
}

function focusPlace(id){
 const p=PLACES[sid].find(x=>x[0]===id);
 if(!p||!map)return;

 selected=id;
 map.flyTo([p[3],p[4]],17,{duration:.6});

 setTimeout(()=>{
  if(markers[id])markers[id].openPopup();
 },650);

 renderPlaces();

 document.getElementById("map").scrollIntoView({
  behavior:"smooth",
  block:"center"
 });
}

function renderPlaces(){
 const el=document.getElementById("places");
 if(!el)return;

 const q=(document.getElementById("placeSearch")?.value||"")
  .trim().toLowerCase();

 const cat=document.getElementById("placeCategory")?.value||"전체";

 const list=PLACES[sid].filter(p=>
  (cat==="전체"||p[2]===cat)&&
  p[1].toLowerCase().includes(q)
 );

 el.innerHTML=list.length?
