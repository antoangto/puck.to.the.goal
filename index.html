function esc(v){
return String(v).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
})[c]);
}

function heading(text){
return `<h2 class="heading">${text}</h2>`;
}

function media(key,caption){
const s=SCHOOLS[sid];
const src=asset(s.images[key]);
return `<figure class="media">
<img src="${src}" alt="${esc(caption)}"
onclick="openLightbox(this.src)"
onerror="this.parentElement.classList.add('bad')">
<div class="media-error">이미지를 불러오지 못했습니다.</div>
<figcaption>${esc(caption)}</figcaption>
</figure>`;
}

function openLightbox(src){
document.getElementById("lightboxImage").src=src;
document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
document.getElementById("lightbox").classList.remove("open");
}

function renderPortal(){
document.getElementById("choices").innerHTML=
Object.entries(SCHOOLS).map(([id,s])=>`
<button class="choice ${id}" onclick="openSchool('${id}')">
<div class="choice-cover">
<img src="${asset(s.images.logo)}" alt="${esc(s.name)} 엠블럼">
</div>
<div class="choice-body">
<small>${s.en}</small>
<h2>${s.name}</h2>
<p>${s.jp}<br>${s.address}</p>
<div class="choice-link">공식 홈페이지 방문 <span>→</span></div>
</div>
</button>`).join("");
}

function openSchool(id){
sid=id;
page="home";
document.getElementById("portal").classList.add("hidden");
document.getElementById("site").classList.remove("hidden");
render();
window.scrollTo(0,0);
}
function backPortal(){
sid=null;
document.getElementById("site").classList.add("hidden");
document.getElementById("portal").classList.remove("hidden");
window.scrollTo(0,0);
}
function go(next){
page=next;
render();
window.scrollTo(0,0);
}

function render(){
const s=SCHOOLS[sid];
const site=document.getElementById("site");
site.className="site "+sid;
document.getElementById("schoolLogo").src=asset(s.images.logo);
document.getElementById("schoolName").textContent=s.jp;
document.getElementById("schoolEnglish").textContent=s.en;
document.getElementById("nav").innerHTML=NAV.map(([id,label])=>
`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`
).join("");

const hero=document.getElementById("hero");
if(page==="home"){
hero.innerHTML=`<div class="hero"><div class="wrap">
<small>WELCOME TO ${s.en}</small>
<h1>${s.jp}</h1>
<p>${s.slogan}<br>전통과 도전이 함께하는 2020년의 학교생활</p>

}else{

hero.innerHTML=`<div class="page-banner"><div class="wrap">

function updateMap(){
const svg=document.getElementById("mapSvg");
if(svg&&mapView){
svg.setAttribute("viewBox",
`${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}`);
}
}

function zoomMap(factor,center){
if(!mapView)return;
const v=mapView;
const oldW=v.w,oldH=v.h;
const nw=Math.max(200,Math.min(1600,oldW/factor));
const nh=nw*.75;
const cx=center?.x??v.x+oldW/2;
const cy=center?.y??v.y+oldH/2;
v.x=cx-(cx-v.x)*nw/oldW;
v.y=cy-(cy-v.y)*nh/oldH;
v.w=nw;
v.h=nh;
updateMap();
}

function resetMap(){
mapView={x:0,y:0,w:1200,h:900};
selectedPlace=null;
document.getElementById("mapPop").classList.add("hidden");
updateMap();
renderPlaces();
}

function focusPlace(id){
const p=MAPS[sid].places.find(x=>x[0]===id);
if(!p)return;
selectedPlace=id;
mapView={x:p[3]-300,y:p[4]-225,w:600,h:450};
updateMap();
const pop=document.getElementById("mapPop");
pop.innerHTML=`<strong>${esc(p[1])}</strong><p>${esc(p[5])}</p>`;
pop.classList.remove("hidden");
renderPlaces();
}

function renderPlaces(){
const el=document.getElementById("places");
if(!el)return;
const q=(document.getElementById("placeSearch")?.value||"")
.trim().toLowerCase();
const cat=document.getElementById("placeCategory")?.value||"전체";
const found=MAPS[sid].places.filter(p=>
(cat==="전체"||p[2]===cat)&&p[1].toLowerCase().includes(q));
el.innerHTML=found.length?found.map(p=>`
<button class="place ${selectedPlace===p[0]?"selected":""}"
onclick="focusPlace('${p[0]}')">
<small>${p[2]}</small>
<strong>${p[1]}</strong>
<p>${p[5]}</p>
</button>`).join(""):`<p class="lead">검색 결과가 없습니다.</p>`;
}

function attachMapEvents(){
const vp=document.getElementById("mapView");
const points=new Map();
let last=null,pinch=null;

vp.addEventListener("pointerdown",e=>{
vp.setPointerCapture(e.pointerId);
points.set(e.pointerId,{x:e.clientX,y:e.clientY});
last={x:e.clientX,y:e.clientY};
});

vp.addEventListener("pointermove",e=>{
if(!points.has(e.pointerId))return;
points.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(points.size===2){
const arr=[...points.values()];
const dist=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
if(pinch)zoomMap(dist/pinch);
pinch=dist;
return;
}
pinch=null;
if(last){
const r=vp.getBoundingClientRect();
mapView.x-=(e.clientX-last.x)/r.width*mapView.w;
mapView.y-=(e.clientY-last.y)/r.height*mapView.h;
updateMap();
last={x:e.clientX,y:e.clientY};
}
});

const end=e=>{
points.delete(e.pointerId);
last=null;
pinch=null;
};
vp.addEventListener("pointerup",end);
vp.addEventListener("pointercancel",end);

vp.addEventListener("wheel",e=>{
e.preventDefault();
const r=vp.getBoundingClientRect();
const rx=(e.clientX-r.left)/r.width;
const ry=(e.clientY-r.top)/r.height;
zoomMap(e.deltaY<0?1.16:.86,{
x:mapView.x+rx*mapView.w,
y:mapView.y+ry*mapView.h
});
},{passive:false});
}
