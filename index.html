'"':"&quot;","'":"&#39;"
})[c]);
}

function svgRect(x,y,w,h,fill,stroke="#c2c9c9",r=3){
return `<rect x="${x}" y="${y}" width="${w}" height="${h}"
rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
}

function drawMap(){
const svg=document.getElementById("mapSVG");
if(!svg)return;
const m=MAPS[sid];
const h=sid==="h";
const out=[];

out.push(`<rect width="1200" height="900"
fill="${h?"#e6eee1":"#e8e8e4"}"/>`);

/* Roads drawn first, buildings drawn only
   inside manually planned parcels */
m.roads.forEach(([a,b])=>{
const horizontal=a[1]===b[1];
out.push(`<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="${h?"#c7d0cb":"#c5c8c8"}"
stroke-width="${h?58:66}"/>`);
out.push(`<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="${h?"#f7f6ef":"#f9f9f6"}"
stroke-width="${h?43:46}"/>`);
if(!h){
out.push(`<line x1="${a[0]}" y1="${a[1]}"
x2="${b[0]}" y2="${b[1]}"
stroke="#d5d7d3" stroke-width="2"
stroke-dasharray="12 18"/>`);
}
});

/* Individual planned building parcels */
m.blocks.forEach(([x,y,w,ht,type],i)=>{
if(type==="park"||type==="square"){
out.push(svgRect(x,y,w,ht,
h?"#c9dfbf":"#d4e1cd","#b5cbb1",7));
out.push(`<path d="M${x+15} ${y+ht/2}
H${x+w-15} M${x+w/2} ${y+12}
V${y+ht-12}" stroke="#f2eede"
stroke-width="10"/>`);
for(let t=0;t<5;t++){
const tx=x+22+(t*43)%(w-35);
const ty=y+20+(t*37)%(ht-35);
out.push(`<circle cx="${tx}" cy="${ty}" r="11"
fill="${t%2?"#9dc28e":"#a7c99b"}"/>`);
}
return;
}

const color=h?
["#d8d5c9","#e5ded0","#cdd4d0","#e4e0d5"][i%4]:
["#c8cdd0","#d9dce0","#bfc7cc","#d5d7d5"][i%4];

out.push(svgRect(x,y,w,ht,color,

/* =========================================
   MAP CAMERA - BOUNDED PAN AND ZOOM
========================================= */

function mapAspect(){
const el=document.getElementById("mapViewport");
const r=el.getBoundingClientRect();
return r.width/r.height;
}

function visibleDimensions(){
const aspect=mapAspect();
const worldAspect=1200/900;

/* Cover the viewport without exposing empty
   space, including portrait mobile screens */
let baseW,baseH;
if(aspect>worldAspect){
baseW=1200;
baseH=1200/aspect;
}else{
baseH=900;
baseW=900*aspect;
}
return {
w:baseW/mapState.zoom,
h:baseH/mapState.zoom
};
}

function clampCamera(){
if(!mapState)return;
mapState.zoom=Math.max(1,Math.min(5,mapState.zoom));
const {w,h}=visibleDimensions();
mapState.cx=Math.max(w/2,Math.min(1200-w/2,mapState.cx));
mapState.cy=Math.max(h/2,Math.min(900-h/2,mapState.cy));
}

function updateMap(){
const svg=document.getElementById("mapSVG");
if(!svg||!mapState)return;
clampCamera();
const {w,h}=visibleDimensions();
svg.setAttribute("viewBox",
`${mapState.cx-w/2} ${mapState.cy-h/2} ${w} ${h}`);
}

function zoomMap(factor,anchor){
if(!mapState)return;
const old=visibleDimensions();
const oldX=mapState.cx-old.w/2;
const oldY=mapState.cy-old.h/2;

mapState.zoom=Math.max(1,Math.min(5,mapState.zoom*factor));

const next=visibleDimensions();
if(anchor){
const worldX=oldX+anchor.x*old.w;
const worldY=oldY+anchor.y*old.h;
mapState.cx=worldX+(0.5-anchor.x)*next.w;
mapState.cy=worldY+(0.5-anchor.y)*next.h;
}
updateMap();
}

function resetMap(){
mapState={cx:600,cy:450,zoom:1};
selectedPlace=null;
document.getElementById("mapPop").classList.add("hidden");
updateMap();
renderPlaces();
}

function focusPlace(id){
const p=MAPS[sid].places.find(x=>x[0]===id);
if(!p)return;
selectedPlace=id;
mapState.zoom=2;
mapState.cx=p[3];
mapState.cy=p[4];
updateMap();

const pop=document.getElementById("mapPop");
pop.innerHTML=`<strong>${escapeHTML(p[1])}</strong>
<p>${escapeHTML(p[5])}</p>`;
pop.classList.remove("hidden");
renderPlaces();
}

function renderPlaces(){
const el=document.getElementById("places");
if(!el)return;
const q=(document.getElementById("placeSearch")?.value||"")
.trim().toLowerCase();
const cat=document.getElementById("placeCategory")?.value||"전체";

const found=MAPS[sid].places.filter(p=>
(cat==="전체"||p[2]===cat)&&
p[1].toLowerCase().includes(q)
);

el.innerHTML=found.length?found.map(p=>`
<button class="place ${selectedPlace===p[0]?"selected":""}"
onclick="focusPlace('${p[0]}')">
<small>${p[2]}</small>
<strong>${escapeHTML(p[1])}</strong>
<p>${escapeHTML(p[5])}</p>
</button>`).join(""):
`<p class="lead">검색 결과가 없습니다.</p>`;
}

function attachMapEvents(){
const viewport=document.getElementById("mapViewport");
const pointers=new Map();
let last=null;
let lastPinch=null;

viewport.addEventListener("pointerdown",e=>{
viewport.setPointerCapture(e.pointerId);
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
last={x:e.clientX,y:e.clientY};
});

viewport.addEventListener("pointermove",e=>{
if(!pointers.has(e.pointerId))return;
pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

if(pointers.size===2){
const a=[...pointers.values()];
const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
if(lastPinch&&lastPinch>0){
zoomMap(dist/lastPinch);
}
lastPinch=dist;
last=null;
return;
}

lastPinch=null;
if(!last){
last={x:e.clientX,y:e.clientY};
return;
}

const rect=viewport.getBoundingClientRect();
const dim=visibleDimensions();
mapState.cx-=(e.clientX-last.x)/rect.width*dim.w;
mapState.cy-=(e.clientY-last.y)/rect.height*dim.h;

last={x:e.clientX,y:e.clientY};
updateMap();
});

const end=e=>{
pointers.delete(e.pointerId);
last=null;
lastPinch=null;
};
viewport.addEventListener("pointerup",end);
viewport.addEventListener("pointercancel",end);
viewport.addEventListener("lostpointercapture",end);

viewport.addEventListener("wheel",e=>{
e.preventDefault();
const rect=viewport.getBoundingClientRect();
zoomMap(e.deltaY<0?1.15:1/1.15,{
x:(e.clientX-rect.left)/rect.width,
y:(e.clientY-rect.top)/rect.height
});
},{passive:false});

window.addEventListener("resize",()=>{
if(page==="map"&&mapState)updateMap();
},{passive:true});
}

renderPortal();
</script>
